<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" width="100%" role="img" aria-label="Native Sparse Attention 三分支结构与门控融合">
  <style>
    .bg{fill:#0b0b10}
    .ttl{fill:#e8e4dc;font:600 26px 'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif}
    .sub{fill:#a09b8d;font:400 15px 'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif}
    .pn{fill:#6b675c;font:600 12px 'Noto Sans SC','PingFang SC',sans-serif}
    .hd{fill:#e8e4dc;font:600 15px 'Noto Sans SC','PingFang SC',sans-serif}
    .lb{fill:#e8e4dc;font:500 13px 'Noto Sans SC','PingFang SC',sans-serif}
    .sm{fill:#a09b8d;font:400 12px 'Noto Sans SC','PingFang SC',sans-serif}
    .an{fill:#a09b8d;font:400 12px 'Noto Sans SC','PingFang SC',sans-serif}
    .eq{fill:#c9a96a;font:600 15px 'JetBrains Mono',Consolas,monospace}
    .b1{fill:#1a1712;stroke:#c9a96a;stroke-width:1.3}
    .b2{fill:#14161c;stroke:#7aa2c8;stroke-width:1.3}
    .b3{fill:#1d1414;stroke:#cf5a50;stroke-width:1.3}
    .tok{fill:#3a3a44}
    .tokhi{fill:#c9a96a;fill-opacity:.85}
    .toksel{fill:#cf5a50;fill-opacity:.9}
    .arw{stroke:#8a8578;stroke-width:1.6;fill:none;marker-end:url(#n1)}
    .arwr{stroke:#cf5a50;stroke-width:1.6;fill:none;marker-end:url(#n2)}
    .div{stroke:#e8e4dc;stroke-opacity:.14;stroke-width:1}
    .foot{fill:#6b675c;font:400 12px 'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif}
  </style>
  <defs>
    <marker id="n1" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto">
      <path d="M0 0 L7 4 L0 8 z" fill="#8a8578"/>
    </marker>
    <marker id="n2" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto">
      <path d="M0 0 L7 4 L0 8 z" fill="#cf5a50"/>
    </marker>
  </defs>
  <rect class="bg" x="0" y="0" width="1200" height="660" rx="14"/>
  <text class="ttl" x="44" y="52">NSA 的三分支结构：压缩、选择、滑窗，再门控融合</text>
  <text class="sub" x="44" y="80">重绘自 Native Sparse Attention 论文 arXiv:2502.11089（ACL 2025 最佳论文）原文图 1。稀疏模式由训练学出，而不是人工设定</text>

  <!-- input token strip -->
  <text class="pn" x="44" y="120">输入序列的三个切面</text>
  <g transform="translate(44,130)">
    <rect class="tok" x="0" y="0" width="20" height="20" rx="3"/>
    <rect class="tok" x="24" y="0" width="20" height="20" rx="3"/>
    <rect class="tok" x="48" y="0" width="20" height="20" rx="3"/>
    <rect class="tok" x="72" y="0" width="20" height="20" rx="3"/>
    <rect class="tok" x="96" y="0" width="20" height="20" rx="3"/>
    <rect class="tok" x="120" y="0" width="20" height="20" rx="3"/>
    <rect class="tok" x="144" y="0" width="20" height="20" rx="3"/>
    <rect class="tokhi" x="168" y="0" width="20" height="20" rx="3"/>
    <rect class="tokhi" x="192" y="0" width="20" height="20" rx="3"/>
    <rect class="tokhi" x="216" y="0" width="20" height="20" rx="3"/>
    <rect class="tokhi" x="240" y="0" width="20" height="20" rx="3"/>
    <text class="sm" x="276" y="15">当前 query 在此</text>
  </g>

  <!-- three branch columns -->
  <path class="arw" d="M180 160 L180 186"/>
  <path class="arw" d="M180 160 L540 160 L540 186"/>
  <path class="arw" d="M180 160 L900 160 L900 186"/>

  <!-- branch 1: compression -->
  <rect class="b1" x="44" y="190" width="272" height="228" rx="10"/>
  <text class="pn" x="60" y="212">分支一　压缩</text>
  <text class="hd" x="60" y="236">抓全局</text>
  <text class="sm" x="60" y="258">连续若干 token 压成一个摘要</text>
  <g transform="translate(60,272)">
    <rect class="tok" x="0" y="0" width="18" height="18" rx="2"/>
    <rect class="tok" x="22" y="0" width="18" height="18" rx="2"/>
    <rect class="tok" x="44" y="0" width="18" height="18" rx="2"/>
    <rect class="tok" x="66" y="0" width="18" height="18" rx="2"/>
    <path class="arw" d="M96 9 L124 9" transform="scale(0.8)"/>
    <rect class="tokhi" x="106" y="-2" width="34" height="22" rx="4"/>
    <text class="sm" x="150" y="15">1 个压缩 KV</text>
  </g>
  <text class="sm" x="60" y="316">代价：丢掉块内细节</text>
  <text class="sm" x="60" y="340">收益：粗粒度上仍看得见远处</text>
  <rect class="b1" x="60" y="356" width="240" height="48" rx="6" fill-opacity=".5"/>
  <text class="sm" x="72" y="376">这一支单独用不够，</text>
  <text class="sm" x="72" y="394">远处某个关键引用可能被压没了</text>

  <!-- branch 2: selection -->
  <rect class="b3" x="404" y="190" width="272" height="228" rx="10"/>
  <text class="pn" x="420" y="212">分支二　选择</text>
  <text class="hd" x="420" y="236">抓重点</text>
  <text class="sm" x="420" y="258">用压缩结果打分，挑出重要的块</text>
  <g transform="translate(420,272)">
    <rect class="tok" x="0" y="0" width="18" height="18" rx="2"/>
    <rect class="tok" x="22" y="0" width="18" height="18" rx="2"/>
    <rect class="tok" x="44" y="0" width="18" height="18" rx="2"/>
    <rect class="tok" x="66" y="0" width="18" height="18" rx="2"/>
    <rect class="tok" x="88" y="0" width="18" height="18" rx="2"/>
    <rect class="tok" x="110" y="0" width="18" height="18" rx="2"/>
    <text class="sm" x="140" y="15">按分数排序</text>
  </g>
  <g transform="translate(420,308)">
    <rect class="toksel" x="0" y="0" width="18" height="18" rx="2"/>
    <rect class="tok" x="22" y="0" width="18" height="18" rx="2"/>
    <rect class="tok" x="44" y="0" width="18" height="18" rx="2"/>
    <rect class="tok" x="66" y="0" width="18" height="18" rx="2"/>
    <rect class="toksel" x="88" y="0" width="18" height="18" rx="2"/>
    <rect class="toksel" x="110" y="0" width="18" height="18" rx="2"/>
    <text class="sm" x="140" y="15">只保留得分高的块</text>
  </g>
  <text class="sm" x="420" y="352">这一支是 NSA 与滑窗类方案的关键差别：</text>
  <text class="sm" x="420" y="374">选哪些块由打分决定，训练时一并学出，</text>
  <text class="sm" x="420" y="396">所以能从预训练阶段就用稀疏方式训练</text>

  <!-- branch 3: sliding window -->
  <rect class="b2" x="764" y="190" width="272" height="228" rx="10"/>
  <text class="pn" x="780" y="212">分支三　滑窗</text>
  <text class="hd" x="780" y="236">保局部</text>
  <text class="sm" x="780" y="258">始终对最近 w 个 token 做稠密注意力</text>
  <g transform="translate(780,272)">
    <rect class="tok" x="0" y="0" width="18" height="18" rx="2"/>
    <rect class="tok" x="22" y="0" width="18" height="18" rx="2"/>
    <rect class="tok" x="44" y="0" width="18" height="18" rx="2"/>
    <rect class="tok" x="66" y="0" width="18" height="18" rx="2"/>
    <rect class="tokhi" x="88" y="0" width="18" height="18" rx="2"/>
    <rect class="tokhi" x="110" y="0" width="18" height="18" rx="2"/>
    <text class="sm" x="140" y="15">近邻保持稠密</text>
  </g>
  <text class="sm" x="780" y="352">这一支是冗余设计：前两支都可能漏掉</text>
  <text class="sm" x="780" y="374">紧邻信息，而语言与驾驶场景里</text>
  <text class="sm" x="780" y="396">局部连续性不能断</text>

  <!-- gating -->
  <path class="arwr" d="M180 418 L180 452 L590 452 L590 474"/>
  <path class="arwr" d="M540 418 L540 452 L590 452"/>
  <path class="arwr" d="M900 418 L900 452 L590 452"/>
  <rect class="b1" x="470" y="474" width="240" height="52" rx="10"/>
  <text class="hd" x="500" y="498">门控加权融合</text>
  <text class="sm" x="500" y="518">可学习，三支权重随输入变化</text>
  <path class="arwr" d="M590 526 L590 556 L500 556 L500 578"/>
  <text class="eq" x="520" y="584">输出 = Σ gᵢ · outᵢ</text>

  <!-- takeaway -->
  <rect class="b1" x="764" y="452" width="272" height="174" rx="10" fill-opacity=".4"/>
  <text class="pn" x="780" y="476">整个流程可微</text>
  <text class="sm" x="780" y="500">这一点决定了 NSA 与"训完再剪枝"</text>
  <text class="sm" x="780" y="522">的路线差别：后者要在推理期把</text>
  <text class="sm" x="780" y="544">稠密模型改成稀疏，通常掉点；</text>
  <text class="sm" x="780" y="566">NSA 从预训练开始就是稀疏的，</text>
  <text class="sm" x="780" y="588">所以论文报告在 64k 长度下</text>
  <text class="sm" x="780" y="610">解码、前向、反向三段都有加速</text>

  <text class="foot" x="44" y="632">重绘自 Jingyang Yuan et al., Native Sparse Attention: Hardware-Aligned and Natively Trainable Sparse Attention, arXiv:2502.11089 原文图 1 与图 2。</text>
</svg>
