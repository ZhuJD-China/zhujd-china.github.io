<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="100%" role="img" aria-label="Multi-Head Latent Attention 结构与解耦 RoPE">
  <style>
    .bg{fill:#0b0b10}
    .ttl{fill:#e8e4dc;font:600 26px 'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif}
    .sub{fill:#a09b8d;font:400 15px 'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif}
    .pn{fill:#6b675c;font:600 12px 'Noto Sans SC','PingFang SC',sans-serif}
    .hd{fill:#e8e4dc;font:600 16px 'Noto Sans SC','PingFang SC',sans-serif}
    .lb{fill:#e8e4dc;font:500 14px 'Noto Sans SC','PingFang SC',sans-serif}
    .sm{fill:#e8e4dc;font:400 12px 'Noto Sans SC','PingFang SC',sans-serif}
    .an{fill:#a09b8d;font:400 12px 'Noto Sans SC','PingFang SC',sans-serif}
    .eq{fill:#c9a96a;font:600 16px 'JetBrains Mono',Consolas,monospace}
    .b1{fill:#1a1712;stroke:#c9a96a;stroke-width:1.3}
    .b2{fill:#14161c;stroke:#7aa2c8;stroke-width:1.3}
    .b3{fill:#1d1414;stroke:#cf5a50;stroke-width:1.3}
    .cache{fill:#c9a96a;fill-opacity:.16;stroke:#c9a96a;stroke-width:1.4;stroke-dasharray:5 3}
    .arw{stroke:#8a8578;stroke-width:1.6;fill:none;marker-end:url(#ah3)}
    .arwg{stroke:#c9a96a;stroke-width:1.8;fill:none;marker-end:url(#ahg)}
    .div{stroke:#e8e4dc;stroke-opacity:.14;stroke-width:1}
    .foot{fill:#6b675c;font:400 12px 'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif}
  </style>
  <defs>
    <marker id="ah3" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto">
      <path d="M0 0 L7 4 L0 8 z" fill="#8a8578"/>
    </marker>
    <marker id="ahg" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto">
      <path d="M0 0 L7 4 L0 8 z" fill="#c9a96a"/>
    </marker>
  </defs>
  <rect class="bg" x="0" y="0" width="1200" height="620" rx="14"/>
  <text class="ttl" x="44" y="52">MLA：只缓存低维潜变量，需要时再把各头的 K、V 还原出来</text>
  <text class="sub" x="44" y="80">重绘自 DeepSeek-V2 论文的 MLA 结构（arXiv:2405.04434），并在右侧补上解码路径与解耦 RoPE 的位置</text>

  <!-- path labels -->
  <text class="pn" x="44" y="118">训练与预填充：下投影一次，上投影到各头</text>
  <text class="pn" x="44" y="382">解码：只走下投影，缓存的正是潜变量</text>

  <!-- main flow -->
  <rect class="b2" x="44" y="132" width="120" height="56" rx="8"/>
  <text class="lb" x="60" y="156">隐状态 h</text>
  <text class="sm" x="60" y="176">维度 512 以上</text>
  <path class="arw" d="M170 160 L206 160"/>

  <rect class="b1" x="212" y="132" width="170" height="56" rx="8"/>
  <text class="lb" x="228" y="156">下投影 W_DKV</text>
  <text class="sm" x="228" y="176">一次，共享给所有头</text>
  <path class="arwg" d="M388 160 L424 160"/>

  <rect class="cache" x="430" y="128" width="150" height="64" rx="8"/>
  <text class="lb" x="446" y="152">潜变量 c_KV</text>
  <text class="sm" x="446" y="172">KV 缓存只存这里</text>
  <text class="sm" x="446" y="188">约 512 维</text>
  <path class="arw" d="M586 160 L622 160"/>

  <rect class="b1" x="628" y="132" width="176" height="56" rx="8"/>
  <text class="lb" x="644" y="156">上投影 W_UK</text>
  <text class="sm" x="644" y="176">还原出各头 K</text>
  <path class="arw" d="M810 160 L846 160"/>

  <rect class="b2" x="852" y="132" width="150" height="56" rx="8"/>
  <text class="lb" x="868" y="156">各头 K 与 V</text>
  <text class="sm" x="868" y="176">算注意力分数</text>

  <path class="arw" d="M810 160 L846 190"/>

  <rect class="b1" x="628" y="212" width="176" height="52" rx="8"/>
  <text class="lb" x="644" y="236">上投影 W_UV</text>
  <text class="sm" x="644" y="254">还原出各头 V</text>
  <path class="arw" d="M586 160 L606 160 L606 238 L622 238"/>

  <!-- decoupled rope branch -->
  <rect class="b3" x="212" y="212" width="170" height="52" rx="8"/>
  <text class="lb" x="228" y="236">解耦位置分支</text>
  <text class="sm" x="228" y="254">加 RoPE，仅约 64 维</text>
  <path class="arw" d="M388 238 L846 238"/>
  <text class="an" x="470" y="228">携带相对位置信息，与低秩压缩通道拼接后再算分数</text>

  <line class="div" x1="44" y1="292" x2="1156" y2="292"/>

  <!-- decode path -->
  <rect class="b2" x="44" y="306" width="120" height="52" rx="8"/>
  <text class="lb" x="60" y="328">新 token 的 h</text>
  <text class="sm" x="60" y="346">只此一个</text>
  <path class="arw" d="M170 332 L206 332"/>

  <rect class="b1" x="212" y="306" width="170" height="52" rx="8"/>
  <text class="lb" x="228" y="328">下投影</text>
  <text class="sm" x="228" y="346">每步一次</text>
  <path class="arw" d="M388 332 L424 332"/>

  <rect class="cache" x="430" y="302" width="150" height="60" rx="8"/>
  <text class="lb" x="446" y="326">追加进缓存</text>
  <text class="sm" x="446" y="346">历史部分原样复用</text>
  <path class="arw" d="M586 332 L622 332"/>

  <rect class="b2" x="628" y="306" width="176" height="52" rx="8"/>
  <text class="lb" x="644" y="328">与全部历史拼接</text>
  <text class="sm" x="644" y="346">得到 c_KV 全序列</text>
  <path class="arw" d="M810 332 L846 332"/>
  <text class="an" x="852" y="330">随后走训练时那套上投影</text>
  <text class="an" x="852" y="350">所以训练与推理解码共用一份权重</text>

  <!-- comparison band -->
  <rect class="b1" x="44" y="392" width="1112" height="118" rx="10" fill-opacity=".4"/>
  <text class="pn" x="60" y="418">与 MQA、GQA 的差别：缓存里放的东西不一样</text>
  <text class="an" x="60" y="444">MQA / GQA 缓存的是「若干个头的完整 K 与 V」，头数少了，但每个头仍然是全维度的；</text>
  <text class="an" x="60" y="466">MLA 缓存的是「一个共享的低维潜变量」，它既不是 K 也不是 V，必须经过上投影才能参与注意力计算。</text>
  <text class="an" x="60" y="492">工程上还有一个关键推论：因为 K 可以从缓存里现算，MLA 不必为 K 单独留一份全精度副本，</text>
  <text class="an" x="60" y="512">这一点直接支撑了 2026 年 DSA 在 MLA 的 MQA 模式上做稀疏选择——稀疏之后仍能走潜变量解码路径。</text>

  <text class="foot" x="44" y="556">重绘自 DeepSeek-AI, DeepSeek-V2 论文 arXiv:2405.04434 原文图 3；解码路径与 DSA 的衔接依据 arXiv:2512.02556（DeepSeek-V3.2）。</text>
  <text class="foot" x="44" y="578">图为结构示意，方框大小不代表真实维度比例；维度数字取 DeepSeek-V3 的常见配置，用于说明量级关系。</text>
</svg>
