<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="100%" role="img" aria-label="审批优先与沙箱优先两种控制流对照">
  <style>
    .bg{fill:#0b0b10}
    .ttl{fill:#e8e4dc;font:600 26px 'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif}
    .sub{fill:#a09b8d;font:400 15px 'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif}
    .pn{fill:#6b675c;font:600 12px 'Noto Sans SC','PingFang SC',sans-serif}
    .hd{fill:#e8e4dc;font:600 15px 'Noto Sans SC','PingFang SC',sans-serif}
    .lb{fill:#e8e4dc;font:500 13px 'Noto Sans SC','PingFang SC',sans-serif}
    .sm{fill:#a09b8d;font:400 12px 'Noto Sans SC','PingFang SC',sans-serif}
    .b1{fill:#1a1712;stroke:#c9a96a;stroke-width:1.3}
    .b2{fill:#14161c;stroke:#7aa2c8;stroke-width:1.3}
    .b3{fill:#1d1414;stroke:#cf5a50;stroke-width:1.3}
    .act{fill:#1a1712;stroke:#c9a96a;stroke-width:1.1}
    .ask{fill:#1d1414;stroke:#cf5a50;stroke-width:1.1}
    .arw{stroke:#8a8578;stroke-width:1.5;fill:none;marker-end:url(#c1m)}
    .arwr{stroke:#cf5a50;stroke-width:1.5;fill:none;marker-end:url(#c2m)}
    .arwg{stroke:#c9a96a;stroke-width:1.5;fill:none;marker-end:url(#c3m)}
    .loop{stroke:#c9a96a;stroke-width:1.4;fill:none;stroke-dasharray:4 3}
    .div{stroke:#e8e4dc;stroke-opacity:.14;stroke-width:1}
    .foot{fill:#6b675c;font:400 12px 'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif}
  </style>
  <defs>
    <marker id="c1m" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto">
      <path d="M0 0 L7 4 L0 8 z" fill="#8a8578"/>
    </marker>
    <marker id="c2m" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto">
      <path d="M0 0 L7 4 L0 8 z" fill="#cf5a50"/>
    </marker>
    <marker id="c3m" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto">
      <path d="M0 0 L7 4 L0 8 z" fill="#c9a96a"/>
    </marker>
  </defs>
  <rect class="bg" x="0" y="0" width="1200" height="640" rx="14"/>
  <text class="ttl" x="44" y="52">两种控制流：每步问人一次，还是先划边界再放手</text>
  <text class="sub" x="44" y="80">这是两个产品的根本差异，比模型能力更决定日常可用性。左侧每个动作都要人点头，右侧在授权边界内连续执行</text>

  <!-- left: approval-first -->
  <text class="pn" x="44" y="116">一　审批优先　副驾驶哲学</text>
  <rect class="b1" x="44" y="126" width="540" height="286" rx="10"/>

  <g transform="translate(64,144)">
    <rect class="act" x="0" y="0" width="120" height="44" rx="8"/>
    <text class="lb" x="14" y="19">模型提出动作</text>
    <text class="sm" x="14" y="36">要改某个文件</text>
    <path class="arw" d="M126 22 L166 22"/>
    <rect class="ask" x="172" y="0" width="140" height="44" rx="8"/>
    <text class="lb" x="186" y="19" fill="#cf5a50">弹出确认</text>
    <text class="sm" x="186" y="36">人在旁边看着</text>
    <path class="arw" d="M318 22 L358 22"/>
    <rect class="act" x="364" y="0" width="120" height="44" rx="8"/>
    <text class="lb" x="378" y="19">执行一步</text>
    <text class="sm" x="378" y="36">再问下一步</text>
    <path class="loop" d="M424 46 L424 66 L100 66 L100 48"/>
    <text class="sm" x="238" y="82" text-anchor="middle">任务没结束就回到第一步</text>
  </g>

  <text class="sm" x="64" y="252">优点：每一步都有人在场，敏感操作不会漏掉，撤销成本低。</text>
  <text class="sm" x="64" y="276">代价：一个改十处的任务要确认十次，注意力被切碎，</text>
  <text class="sm" x="64" y="298">人在等待里逐渐失去对全局的判断。</text>
  <rect class="b3" x="64" y="314" width="500" height="78" rx="8" fill-opacity=".5"/>
  <text class="sm" x="80" y="338">适用场景：不可逆的写操作、涉及生产环境、</text>
  <text class="sm" x="80" y="358">审计要求高的行业。人在环是卖点而不是负担。</text>
  <text class="sm" x="80" y="380">而且审批本身是可审计证据链的一部分。</text>

  <!-- right: sandbox-first -->
  <text class="pn" x="616" y="116">二　沙箱优先　自动驾驶哲学</text>
  <rect class="b2" x="616" y="126" width="540" height="286" rx="10"/>

  <g transform="translate(636,144)">
    <rect class="b2" x="0" y="0" width="130" height="44" rx="8"/>
    <text class="lb" x="14" y="19">划定授权边界</text>
    <text class="sm" x="14" y="36">目录、命令白名单</text>
    <path class="arw" d="M136 22 L176 22"/>
    <rect class="b2" x="182" y="0" width="160" height="44" rx="8"/>
    <text class="lb" x="196" y="19">在沙箱内连续执行</text>
    <text class="sm" x="196" y="36">读、改、跑测试</text>
    <path class="arw" d="M348 22 L388 22"/>
    <rect class="b3" x="394" y="0" width="110" height="44" rx="8"/>
    <text class="lb" x="408" y="19" fill="#cf5a50">越界才停</text>
    <text class="sm" x="408" y="36">并上报</text>
    <path class="arw" d="M449 46 L449 66 L120 66 L120 48"/>
    <text class="sm" x="280" y="82" text-anchor="middle">常规任务不再打扰人</text>
  </g>

  <text class="sm" x="636" y="252">优点：多文件改动可以一口气跑完，人只在越界时介入。</text>
  <text class="sm" x="636" y="276">代价：边界划得对不对，全靠配置与默认值；一旦划宽，</text>
  <text class="sm" x="636" y="298">越界就发生在你没看着的时候。</text>
  <rect class="b2" x="636" y="314" width="500" height="78" rx="8" fill-opacity=".6"/>
  <text class="sm" x="652" y="338">适用场景：可回滚的仓库内改动、批量重构、</text>
  <text class="sm" x="652" y="358">以及需要后台并行的任务。</text>
  <text class="sm" x="652" y="380">沙箱的真实强度决定了这条路是否安全。</text>

  <line class="div" x1="44" y1="440" x2="1156" y2="440"/>

  <text class="hd" x="44" y="468">真正的分歧点不是"要不要人管"，而是"管的时机在哪"</text>
  <text class="sm" x="44" y="494">两种流都在追求同一件事：让不可逆的操作不逃出控制。分歧在于控制点放在动作之前还是之中。</text>
  <text class="sm" x="44" y="516">放在之前（划边界）可以换来吞吐，代价是边界一旦划错就没有中间态；放在之中（逐步确认）换来确定性，</text>
  <text class="sm" x="44" y="538">代价是注意力被切碎。这也解释了为什么两边都在往对方的方向挪：一边在加"计划模式"和批量确认，</text>
  <text class="sm" x="44" y="560">另一边在加细粒度的权限策略、可审计的会话回放与更严的默认沙箱。</text>
  <text class="sm" x="44" y="582">所以真正的差别是渐进收敛，而不是谁天然更安全。</text>

  <text class="foot" x="44" y="614">图为控制流抽象示意，方框不代表具体产品的实现细节；两家产品的具体权限模型、沙箱强度与默认值以各自的官方文档为准。</text>
  <text class="foot" x="44" y="636">参考其公开文档：Anthropic 的 Claude Code 权限与 hooks 说明、OpenAI Codex 的沙箱与审批配置文档。</text>
</svg>
