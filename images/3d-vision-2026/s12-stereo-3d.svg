  <text class="xs" x="800" y="122" text-anchor="start" fill="#6b675c">误差棒长度已放大 6 倍</text>
  <text class="xs" x="800" y="148" text-anchor="start">距离 z</text>
  <text class="xs" x="930" y="148" text-anchor="start">视差 d</text>
  <text class="xs" x="1050" y="148" text-anchor="start">ε_z</text>
