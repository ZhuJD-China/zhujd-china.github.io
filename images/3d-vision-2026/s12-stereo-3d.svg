  <text class="sm" x="800" y="180" text-anchor="start">150 mm</text>
  <text class="mon" x="930" y="180" text-anchor="end">160 px</text>
  <text class="mon" x="1050" y="180" text-anchor="end" fill="#cf5a50">0.47 mm</text>
  <text class="sm" x="800" y="206" text-anchor="start">330 mm</text>
  <text class="mon" x="930" y="206" text-anchor="end">73 px</text>
  <text class="mon" x="1050" y="206" text-anchor="end" fill="#cf5a50">2.27 mm</text>
  <text class="sm" x="800" y="232" text-anchor="start">560 mm</text>
  <text class="mon" x="930" y="232" text-anchor="end">43 px</text>
  <text class="mon" x="1050" y="232" text-anchor="end" fill="#cf5a50">6.53 mm</text>
  <text class="sm" x="800" y="264" text-anchor="start" fill="#c9a96a">距离翻 2 倍，ε_z 变 4 倍</text>
  <rect x="778" y="330" width="356" height="186" rx="10" fill="#1a1712" fill-opacity="0.5" stroke="#c9a96a" stroke-width="1.2"/>
  <text class="hd" x="800" y="358" text-anchor="start" fill="#c9a96a">为什么是二次的</text>
  <text class="mon" x="800" y="386" text-anchor="start">纵向放大率 m_v = f / b = 400 / 60 ≈ 6.7</text>
  <text class="sm" x="800" y="410" text-anchor="start">这是一个与距离无关的常数。</text>
  <text class="sm" x="800" y="436" text-anchor="start">视差误差 ε_d 在像面上是固定的</text>
  <text class="sm" x="800" y="456" text-anchor="start" fill="#c9a96a">→ 折算到纵向就是 ε_z = ε_d · z² /(b·f)</text>
  <text class="xs" x="800" y="482" text-anchor="start" fill="#a09b8d">z 出现在平方里，因为它既缩短视差，</text>
  <text class="xs" x="800" y="498" text-anchor="start" fill="#a09b8d">又把这段纵向长度放大。</text>
  <rect x="22" y="556" width="1134" height="92" rx="10" fill="#14161c" stroke="#8a8578" stroke-width="1.2"/>
  <text class="hd" x="44" y="582" text-anchor="start">误差公式里四个变量，只有两个真能拧</text>
  <text class="lb" x="44" y="606" text-anchor="start" fill="#e8e4dc">z 工作距离</text>
  <text class="xs" x="44" y="624" text-anchor="start" fill="#cf5a50">最大杠杆</text>
  <text class="xs" x="136" y="624" text-anchor="start" fill="#6b675c">移远一倍 → 精度差 4 倍</text>
  <text class="lb" x="326" y="606" text-anchor="start" fill="#e8e4dc">b 基线</text>
  <text class="xs" x="326" y="624" text-anchor="start" fill="#c9a96a">线性改善</text>
  <text class="xs" x="418" y="624" text-anchor="start" fill="#6b675c">加宽基线是最直接的手段</text>
  <text class="lb" x="608" y="606" text-anchor="start" fill="#e8e4dc">f 焦距</text>
  <text class="xs" x="608" y="624" text-anchor="start" fill="#c9a96a">线性改善</text>
  <text class="xs" x="700" y="624" text-anchor="start" fill="#6b675c">但同时压窄视场</text>
  <text class="lb" x="890" y="606" text-anchor="start" fill="#e8e4dc">ε_d 亚像素</text>
  <text class="xs" x="890" y="624" text-anchor="start" fill="#a09b8d">依赖亚像素算法</text>
  <text class="xs" x="982" y="624" text-anchor="start" fill="#6b675c">现实里最难达标的一项</text>
  <text class="foot" x="44" y="674" text-anchor="start">几何按真实比例绘制：b = 60 mm，f = 400 px，工件沿光轴摆放；误差棒为便于观察放大 6 倍。</text>
</svg>
