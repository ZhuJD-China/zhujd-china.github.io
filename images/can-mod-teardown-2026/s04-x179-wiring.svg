<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" width="100%" role="img" aria-label="四根线怎么接：从车端 X179 连接器到微雪 ESP32-S3-RS485-CAN 的螺丝端子">
  <style>
    .bg{fill:#0b0b10}
    .ttl{fill:#e8e4dc;font:600 27px 'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif}
    .sub{fill:#a09b8d;font:400 15px 'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif}
    .nm{fill:#e8e4dc;font:600 15px 'Noto Sans SC','PingFang SC',sans-serif}
    .ds{fill:#e8e4dc;font:400 13px 'Noto Sans SC','PingFang SC',sans-serif}
    .ds2{fill:#a09b8d;font:400 13px 'Noto Sans SC','PingFang SC',sans-serif}
    .cm{fill:#6b675c;font:500 12px 'Noto Sans SC','PingFang SC',sans-serif}
    .warn{fill:#cf5a50;font:600 15px 'Noto Sans SC','PingFang SC',sans-serif}
    .foot{fill:#6b675c;font:400 13px 'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif}
    .grid{stroke:#e8e4dc;stroke-opacity:.10;stroke-width:1}
    .a{fill:#c9a96a}
    .b{fill:#7aa2c8}
    .bad{fill:#cf5a50}
    .chip{fill:#e8e4dc;fill-opacity:.055;stroke:#e8e4dc;stroke-opacity:.13;stroke-width:1}
    .wire{stroke:#c9a96a;stroke-width:2;fill:none}
    .wire2{stroke:#7aa2c8;stroke-width:2;fill:none}
    .ah{fill:#c9a96a}
    .ah2{fill:#7aa2c8}
    .stub{stroke:#e8e4dc;stroke-opacity:.22;stroke-width:2;fill:none}
  </style>

  <rect class="bg" x="0" y="0" width="1200" height="650" rx="14"/>
  <text class="ttl" x="44" y="56">四根线怎么接：从 X179 到螺丝端子</text>
  <text class="sub" x="44" y="86">行号均为 HARDWARE.md；接哪一对由第 9 节记下的 Service Mode 决定 —— 全部是仓库文档转述，我一条都没接车实测</text>

  <text class="cm" x="56" y="130">① 车端 X179 —— 4 对候选，只接其中一对</text>
  <text class="cm" x="394" y="130">② 四根线</text>
  <text class="cm" x="712" y="130">③ 板端 · 微雪 ESP32-S3-RS485-CAN</text>

  <!-- ① X179 -->
  <rect class="a" x="44" y="144" width="346" height="240" rx="6" fill-opacity=".10"/>
  <rect class="chip" x="56" y="156" width="322" height="32" rx="4"/>
  <text class="nm" x="68" y="177">2 / 3</text>
  <text class="ds" x="150" y="177">Party CAN</text>
  <text class="ds2" x="366" y="177" text-anchor="end">nag killer :123</text>

  <rect class="chip" x="56" y="192" width="322" height="32" rx="4"/>
  <text class="nm" x="68" y="213">9 / 10</text>
  <text class="ds" x="150" y="213">Vehicle CAN</text>
  <text class="ds2" x="366" y="213" text-anchor="end">0x3C2 :280</text>

  <rect class="chip" x="56" y="228" width="322" height="32" rx="4"/>
  <text class="nm" x="68" y="249">13 / 14</text>
  <text class="ds" x="150" y="249">网关转发子集</text>
  <text class="ds2" x="366" y="249" text-anchor="end" fill="#c9a96a">示意 :399</text>

  <rect class="chip" x="56" y="264" width="322" height="32" rx="4"/>
  <text class="nm" x="68" y="285">18 / 19</text>
  <text class="ds" x="150" y="285">Chassis</text>
  <text class="ds2" x="366" y="285" text-anchor="end">0x370 :293</text>

  <line class="grid" x1="56" y1="304" x2="378" y2="304"/>

  <rect class="chip" x="56" y="312" width="322" height="32" rx="4"/>
  <text class="nm" x="68" y="333">15</text>
  <text class="ds" x="150" y="333">+12V（1 亦可）</text>
  <text class="ds2" x="366" y="333" text-anchor="end">2mm² 线</text>

  <rect class="chip" x="56" y="348" width="322" height="32" rx="4"/>
  <text class="nm" x="68" y="369">20</text>
  <text class="ds" x="150" y="369">GND</text>
  <text class="ds2" x="366" y="369" text-anchor="end">26-pin 用 26</text>

  <!-- ② wires -->
  <line class="stub" x1="390" y1="240" x2="394" y2="240"/>
  <line class="stub" x1="394" y1="180" x2="394" y2="300"/>

  <line class="wire" x1="394" y1="180" x2="688" y2="180"/>
  <path class="ah" d="M688 175 L700 180 L688 185 Z"/>
  <text class="nm" x="540" y="171" text-anchor="middle">CAN-H</text>

  <line class="wire" x1="394" y1="220" x2="688" y2="220"/>
  <path class="ah" d="M688 215 L700 220 L688 225 Z"/>
  <text class="nm" x="540" y="211" text-anchor="middle">CAN-L</text>

  <line class="wire2" x1="394" y1="260" x2="688" y2="260"/>
  <path class="ah2" d="M688 255 L700 260 L688 265 Z"/>
  <text class="nm" x="540" y="251" text-anchor="middle">+12V</text>

  <line class="wire2" x1="394" y1="300" x2="688" y2="300"/>
  <path class="ah2" d="M688 295 L700 300 L688 305 Z"/>
  <text class="nm" x="540" y="291" text-anchor="middle">GND</text>

  <text class="ds2" x="394" y="336">H / L 取自左侧选中的那一对；电源与地固定</text>
  <text class="ds2" x="394" y="360">备选：OBD-II 6 / 14（:280）</text>

  <!-- ③ board -->
  <rect class="b" x="700" y="144" width="456" height="240" rx="6" fill-opacity=".10"/>

  <rect class="chip" x="712" y="166" width="210" height="28" rx="4"/>
  <text class="nm" x="726" y="185">CAN-H 端子</text>
  <text class="ds2" x="936" y="184">板载隔离 · TVS</text>

  <rect class="chip" x="712" y="206" width="210" height="28" rx="4"/>
  <text class="nm" x="726" y="225">CAN-L 端子</text>
  <text class="ds2" x="936" y="224">120Ω 跳线帽出厂 NC</text>

  <rect class="chip" x="712" y="246" width="210" height="28" rx="4"/>
  <text class="nm" x="726" y="265">V+ 端子（12V）</text>
  <text class="ds2" x="936" y="264">板载降压 7–36V</text>

  <rect class="chip" x="712" y="286" width="210" height="28" rx="4"/>
  <text class="nm" x="726" y="305">GND 端子</text>
  <text class="ds2" x="936" y="304">不用外部降压模块</text>

  <text class="ds2" x="716" y="334">车上已终结 —— 别加第二个 120Ω（:633）</text>
  <text class="ds2" x="716" y="358">脱车量：~120Ω 正常 / ~60Ω = 你的终结器开着</text>

  <!-- warnings -->
  <rect class="bad" x="44" y="404" width="360" height="110" rx="6" fill-opacity=".10"/>
  <text class="warn" x="60" y="430">120Ω：不要加第二个</text>
  <text class="ds2" x="60" y="454">车上已经终结（:633）</text>
  <text class="ds2" x="60" y="476">脱车量 ~120Ω = 正常；~60Ω =</text>
  <text class="ds2" x="60" y="498">你的模块终结器开着，先关掉（:646）</text>

  <rect class="bad" x="420" y="404" width="360" height="110" rx="6" fill-opacity=".10"/>
  <text class="warn" x="436" y="430">供电只能走一路</text>
  <text class="ds2" x="436" y="454">螺丝端子 与 USB Type-C 同时接，</text>
  <text class="ds2" x="436" y="476">可能损坏模块（微雪 wiki FAQ）</text>
  <text class="ds2" x="436" y="498">OBD-II pin 16 常电，几天放干 12V（:653）</text>

  <rect class="bad" x="796" y="404" width="360" height="110" rx="6" fill-opacity=".10"/>
  <text class="warn" x="812" y="430">OBD-II 口先分清是不是 DoIP</text>
  <text class="ds2" x="812" y="454">2024+ 按生产日期与地区判断（第 9 节）</text>
  <text class="ds2" x="812" y="476">9 / 10、12 / 13 可能已不是 CAN</text>
  <text class="ds2" x="812" y="498">以 Service Mode 的 CAN Port 页为准（:104）</text>

  <line class="grid" x1="44" y1="540" x2="1156" y2="540"/>
  <text class="nm" x="44" y="570">上电之前先做这三项静态检查（第 11 节第六步）</text>
  <text class="ds2" x="44" y="594">脱车量 CAN-H↔CAN-L → 万用表确认 1 / 15 哪一路有电 → 示波器每一对（区分 CAN 与 DoIP）</text>
  <text class="foot" x="44" y="624">全部转述自 HARDWARE.md 与微雪 wiki，行号可复现；我一条都没接车实测 —— 仓库的指南到此为止。</text>
</svg>
