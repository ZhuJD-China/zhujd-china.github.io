<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="100%" role="img" aria-label="全局快门与滚动快门的读出时序与形变对照">
<style>
    .bg{fill:#0b0b10}
    .ttl{fill:#e8e4dc;font:600 26px 'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif}
    .sub{fill:#a09b8d;font:400 15px 'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif}
    .pn{fill:#6b675c;font:600 12px 'Noto Sans SC','PingFang SC',sans-serif}
    .hd{fill:#e8e4dc;font:600 15px 'Noto Sans SC','PingFang SC',sans-serif}
    .lb{fill:#e8e4dc;font:500 14px 'Noto Sans SC','PingFang SC',sans-serif}
    .sm{fill:#a09b8d;font:400 12px 'Noto Sans SC','PingFang SC',sans-serif}
    .eq{fill:#c9a96a;font:600 14px 'JetBrains Mono',Consolas,monospace}
    .b1{fill:#1a1712;stroke:#c9a96a;stroke-width:1.3}
    .b2{fill:#1d1414;stroke:#cf5a50;stroke-width:1.3}
    .ok{fill:#c9a96a;fill-opacity:.85}
    .bad{fill:#cf5a50;fill-opacity:.85}
    .rowg{fill:#1a1712;stroke:#c9a96a;stroke-width:1.2}
    .rowr{fill:#1d1414;stroke:#cf5a50;stroke-width:1.2}
    .div{stroke:#e8e4dc;stroke-opacity:.14;stroke-width:1}
    .arw{stroke:#8a8578;stroke-width:1.5;fill:none;marker-end:url(#g1m)}
    .foot{fill:#6b675c;font:400 12px 'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif}
  </style>
<defs>
<marker id="g1m" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto">
<path d="M0 0 L7 4 L0 8 z" fill="#8a8578"/>
</marker>
</defs>
<rect class="bg" x="0" y="0" width="1200" height="620" rx="14"/>
<text class="ttl" x="44" y="52">全局快门与滚动快门：一次曝光，还是逐行曝光
</text>
<text class="sub" x="44" y="80">这是工业相机与手机相机最本质的分野。运动物体在滚动快门下会被拍成斜切、扭曲的形状，这不是算法能修的
</text>
<!-- global shutter -->
<text class="pn" x="44" y="118">一　全局快门：全画面同一时刻曝光
</text>
<rect class="b1" x="44" y="128" width="540" height="212" rx="10"/>
<text class="sm" x="60" y="152">整个靶面同时开始曝光、同时结束
</text>
<g transform="translate(60,164)">
<rect class="rowg" x="0" y="0" width="220" height="120" rx="4"/>
<rect class="ok" x="12" y="16" width="52" height="88" rx="3"/>
<rect class="ok" x="76" y="16" width="52" height="88" rx="3"/>
<rect class="ok" x="140" y="16" width="52" height="88" rx="3"/>
<text class="sm" x="236" y="40">一个运动中的方块
</text>
<text class="sm" x="236" y="62">每一条竖边都笔直
</text>
<text class="sm" x="236" y="84">几何关系可测量
</text>
</g>
<text class="sm" x="60" y="308">测尺寸、测角度、测位置的任务必须用它：形状失真直接变成测量误差。
</text>
<text class="sm" x="60" y="330">代价是读出方式受限，全局快门传感器的读出速度通常慢于同代滚动快门传感器。
</text>
<!-- rolling shutter -->
<text class="pn" x="616" y="118">二　滚动快门：逐行开始、逐行结束
</text>
<rect class="b2" x="616" y="128" width="540" height="212" rx="10"/>
<text class="sm" x="632" y="152">每一行在不同时刻曝光，读完一行才开始下一行
</text>
<g transform="translate(632,164)">
<rect class="rowr" x="0" y="0" width="220" height="120" rx="4"/>
<g>
<rect class="bad" x="12" y="16" width="46" height="18" rx="2"/>
<rect class="bad" x="20" y="40" width="46" height="18" rx="2"/>
<rect class="bad" x="28" y="64" width="46" height="18" rx="2"/>
<rect class="bad" x="36" y="88" width="46" height="16" rx="2"/>
</g>
<path d="M96 16 L104 16 L104 104 L96 104" stroke="#cf5a50" stroke-width="1.2" fill="none" stroke-dasharray="3 2"/>
<text class="sm" x="112" y="40">方块被读成斜切
</text>
<text class="sm" x="112" y="62">竖边随行偏移
</text>
<text class="sm" x="112" y="84">高速时形变越大
</text>
</g>
<text class="sm" x="632" y="308">好处是读出快、帧率高、功耗低，所以手机与多数高速应用都选它。
</text>
<text class="sm" x="632" y="330">一旦目标横向运动，几何测量就不可信；需要额外手段抑制：脉冲照明、频闪灯，或改用全局快门。
</text>
<line class="div" x1="44" y1="368" x2="1156" y2="368"/>
<!-- the skew math -->
<text class="hd" x="44" y="396">形变怎么算：一个可以直接代入的式子
</text>
<rect class="b1" x="44" y="408" width="1112" height="86" rx="10" fill-opacity=".5"/>
<text class="eq" x="60" y="436">倾斜量 ≈ v × t_read　　（目标横向速度 × 全画面读出时间）
</text>
<text class="sm" x="60" y="462">读出时间就是帧率的倒数：1000 fps 对应 1 ms 读出，物体横向 1 m/s 时，整幅画面上端与下端就会错开约 1 mm。
</text>
<text class="sm" x="60" y="484">所以"要不要全局快门"本质是在问：这个位移量相对我的测量公差是否可忽略。这条判据比任何参数表都直接。
</text>
<text class="foot" x="44" y="528">图为原理示意，形变幅度经过夸张以便观察。真实倾角取决于目标速度、读出时间与被测物体的位置。
</text>
<text class="foot" x="44" y="552">实际产品例：Allied Vision fxo530CXGE 为全局快门（24.6 MP、49.6 fps），同厂 shr411CXGE-T 为滚动快门（151 MP、6.2 fps），后者为 3.76 µm 大像元配 10GigE 输出。
</text>
<text class="foot" x="44" y="576">选型时注意：厂商规格页上的 Shutter type 字段（GS / RS）就是这一项，写在传感器型号之后，很容易被忽略。
</text>
<text class="foot" x="44" y="600">读法：这两者不是高低之分而是取舍。全局快门买到的是几何保真，滚动快门买到的是速度与成本。
</text>
</svg>
