<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" width="100%" role="img" aria-label="显存与网格面积为何不成比例">
  <style>
    .bg{fill:#0b0b10}
    .ttl{fill:#e8e4dc;font:600 27px 'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif}
    .sub{fill:#a09b8d;font:400 15px 'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif}
    .st{fill:#e8e4dc;font:500 17px 'Noto Sans SC','PingFang SC',sans-serif}
    .lbl{fill:#e8e4dc;font:400 15px 'Noto Sans SC','PingFang SC',sans-serif}
    .val{fill:#e8e4dc;font:600 15px 'Noto Sans SC','PingFang SC',sans-serif}
    .vin{fill:#0b0b10;font:700 15px 'Noto Sans SC','PingFang SC',sans-serif}
    .ax{fill:#6b675c;font:400 12px 'Noto Sans SC','PingFang SC',sans-serif}
    .foot{fill:#6b675c;font:400 13px 'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif}
    .grid{stroke:#e8e4dc;stroke-opacity:.10;stroke-width:1}
    .bar1{fill:#c9a96a}
    .bar2{fill:#7aa2c8}
  </style>
  <rect class="bg" x="0" y="0" width="1200" height="470" rx="14"/>
  <text class="ttl" x="44" y="56">显存与网格面积：4.4 倍对 16 倍</text>
  <text class="sub" x="44" y="86">左栏为官方 Model Zoo 的每卡训练显存，右栏为网格点数；两者不成正比，说明主要开销不在网格</text>

  <!-- left panel: memory, 0 to 30 GB over 180px -->
  <text class="st" x="44" y="132">每卡训练显存（官方）</text>
  <line class="grid" x1="60" y1="152" x2="60" y2="368"/>
  <line class="grid" x1="240" y1="152" x2="240" y2="368"/>
  <text class="ax" x="60" y="386" text-anchor="middle">0</text>
  <text class="ax" x="240" y="386" text-anchor="middle">30 GB</text>
  <rect class="bar1" x="60" y="164" width="39" height="30" rx="4"/>
  <text class="lbl" x="110" y="185">tiny 50×50</text><text class="val" x="196" y="185">6.5</text>
  <rect class="bar1" x="60" y="212" width="63" height="30" rx="4"/>
  <text class="lbl" x="134" y="233">small 150×150</text><text class="val" x="196" y="233">10.5</text>
  <rect class="bar1" x="60" y="260" width="171" height="30" rx="4"/>
  <text class="lbl" x="242" y="281">base 200×200</text><text class="vin" x="221" y="281" text-anchor="end">28.5</text>
  <rect class="bar1" x="60" y="316" width="171" height="30" rx="4" fill-opacity=".22"/>
  <text class="lbl" x="242" y="337">tiny 到 base</text><text class="vin" x="221" y="337" text-anchor="end">4.4×</text>

  <line class="grid" x1="330" y1="120" x2="330" y2="380"/>

  <!-- right panel: grid cells, 0 to 40,000 over 360px -->
  <text class="st" x="370" y="132">网格点数（面积）</text>
  <line class="grid" x1="386" y1="152" x2="386" y2="368"/>
  <line class="grid" x1="566" y1="152" x2="566" y2="368"/>
  <line class="grid" x1="746" y1="152" x2="746" y2="368"/>
  <text class="ax" x="386" y="386" text-anchor="middle">0</text>
  <text class="ax" x="566" y="386" text-anchor="middle">20,000</text>
  <text class="ax" x="746" y="386" text-anchor="middle">40,000</text>
  <rect class="bar2" x="386" y="164" width="23" height="30" rx="4"/>
  <text class="lbl" x="420" y="185">tiny 50×50</text><text class="val" x="500" y="185">2,500</text>
  <rect class="bar2" x="386" y="212" width="203" height="30" rx="4"/>
  <text class="lbl" x="600" y="233">small 150×150</text><text class="vin" x="579" y="233" text-anchor="end">22,500</text>
  <rect class="bar2" x="386" y="260" width="360" height="30" rx="4"/>
  <text class="lbl" x="758" y="281">base 200×200</text><text class="vin" x="736" y="281" text-anchor="end">40,000</text>
  <rect class="bar2" x="386" y="316" width="360" height="30" rx="4" fill-opacity=".22"/>
  <text class="lbl" x="758" y="337">tiny 到 base</text><text class="vin" x="736" y="337" text-anchor="end">16×</text>

  <line class="grid" x1="44" y1="406" x2="1156" y2="406"/>
  <text class="foot" x="44" y="430">读法：网格面积放大 16 倍，显存只放大 4.4 倍。随网格平方增长的部分仅限注意力与 BEV 特征图，其余开销来自 backbone、图像特征缓存与队列中的 4 帧图像。</text>
  <text class="foot" x="44" y="456">实践含义：选配显存应按 24 至 32 GB 起步并留冗余，按网格面积线性外推显存会低估；这正是三档配置的划分依据。</text>
</svg>
