<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="100%" role="img" aria-label="BEVFormer 三个部件与计算量账本">
  <style>
    .bg{fill:#0b0b10}
    .ttl{fill:#e8e4dc;font:600 27px 'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif}
    .sub{fill:#a09b8d;font:400 15px 'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif}
    .st{fill:#e8e4dc;font:500 16px 'Noto Sans SC','PingFang SC',sans-serif}
    .bt{fill:#0b0b10;font:600 13px 'Noto Sans SC','PingFang SC',sans-serif}
    .bn{fill:#e8e4dc;font:500 14px 'Noto Sans SC','PingFang SC',sans-serif}
    .bd{fill:#a09b8d;font:400 12px 'Noto Sans SC','PingFang SC',sans-serif}
    .num{fill:#e8e4dc;font:600 20px 'Noto Sans SC','PingFang SC',sans-serif}
    .numb{fill:#0b0b10;font:700 22px 'Noto Sans SC','PingFang SC',sans-serif}
    .numg{fill:#c9a96a;font:700 22px 'Noto Sans SC','PingFang SC',sans-serif}
    .nl{fill:#a09b8d;font:400 12px 'Noto Sans SC','PingFang SC',sans-serif}
    .foot{fill:#6b675c;font:400 13px 'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif}
    .flow{stroke:#e8e4dc;stroke-opacity:.28;stroke-width:1.6;fill:none;marker-end:url(#a)}
    .p1{fill:#1a1712;stroke:#c9a96a;stroke-width:1.2}
    .p2{fill:#14161c;stroke:#7aa2c8;stroke-width:1.2}
    .p3{fill:#1d1414;stroke:#cf5a50;stroke-width:1.2}
  </style>
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0 L8 4.5 L0 9 z" fill="#8a8578"/>
    </marker>
  </defs>
  <rect class="bg" x="0" y="0" width="1200" height="560" rx="14"/>
  <text class="ttl" x="44" y="56">BEVFormer 三个部件与计算量账本</text>
  <text class="sub" x="44" y="86">左半部为数据流，右半部为每帧的采样次数；两个数字的量级差解释了为何必须用可变形注意力</text>

  <!-- stage boxes -->
  <rect class="p1" x="44" y="130" width="190" height="76" rx="10"/>
  <text class="bt" x="60" y="156">1 图像特征</text>
  <text class="bd" x="60" y="178">6 相机，FPN 多尺度</text>
  <text class="bd" x="60" y="196">特征图约 1600×704</text>

  <rect class="p1" x="290" y="130" width="230" height="76" rx="10"/>
  <text class="bt" x="306" y="156">2 BEV query 网格</text>
  <text class="bd" x="306" y="178">200×200 = 40,000 个格子</text>
  <text class="bd" x="306" y="196">每格可学习，范围正负 51.2 米</text>

  <rect class="p2" x="576" y="130" width="250" height="76" rx="10"/>
  <text class="bt" x="592" y="156">3 空间交叉注意力</text>
  <text class="bd" x="592" y="178">每格 4 个参考点 × 8 采样点</text>
  <text class="bd" x="592" y="196">投影至图像后按 deformable 采样</text>

  <rect class="p2" x="882" y="130" width="250" height="76" rx="10"/>
  <text class="bt" x="898" y="156">4 时序自注意力</text>
  <text class="bd" x="898" y="178">上一帧 BEV 按自车运动对齐</text>
  <text class="bd" x="898" y="196">队列 4 帧，逐帧对齐后融合</text>

  <path class="flow" d="M240 168 L284 168"/>
  <path class="flow" d="M526 168 L570 168"/>
  <path class="flow" d="M832 168 L876 168"/>

  <!-- computation ledger -->
  <text class="st" x="44" y="262">每帧采样次数的两种算法</text>

  <rect class="p3" x="44" y="284" width="290" height="140" rx="10"/>
  <text class="bt" x="60" y="310">全注意力（不可行）</text>
  <text class="num" x="60" y="352">4.5 × 10^10</text>
  <text class="nl" x="60" y="376">40,000 格 × 约 113 万像素</text>
  <text class="bd" x="60" y="400">每格对整幅图像做注意力</text>

  <rect class="p2" x="360" y="284" width="290" height="140" rx="10"/>
  <text class="bt" x="376" y="310">可变形注意力（实际实现）</text>
  <text class="num" x="376" y="352">1.28 × 10^6</text>
  <text class="nl" x="376" y="376">40,000 格 × 4 参考点 × 8 点</text>
  <text class="bd" x="376" y="400">每格仅采样 32 个点</text>

  <rect class="p1" x="676" y="284" width="456" height="140" rx="10"/>
  <text class="bt" x="692" y="310">量级差与代价</text>
  <text class="numg" x="692" y="360">≈ 3.5 万倍</text>
  <text class="bd" x="692" y="384">这一差距是该模型能在 A100 上以 batch 1 训练的直接原因</text>
  <text class="bd" x="692" y="404">代价是采样点由学习得到，缺乏全局视野，视野外靠 6 层 encoder 补</text>

  <line class="flow" d="M334 354 L356 354" style="marker-end:none"/>
  <path class="flow" d="M650 354 L672 354"/>

  <text class="foot" x="44" y="462">口径：像素数取 nuScenes 相机分辨率约 1600×704 的量级估算，实际由可变形注意力绕开，故为量级对照而非精确值。</text>
  <text class="foot" x="44" y="488">四帧队列的时序自注意力另有一次同样量级的采样，但因 key 与 value 共享上一帧特征，开销与空间交叉注意力同阶而非叠加。</text>
  <text class="foot" x="44" y="514">配置数字取自仓库的 base 配置：200×200 网格、队列 4 帧、每卡 batch 1、检测头 900 query、encoder 6 层、每列参考点 4 个。</text>
</svg>
