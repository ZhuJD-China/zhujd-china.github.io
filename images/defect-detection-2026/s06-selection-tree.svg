<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="100%" role="img" aria-label="缺陷检测选型决策树">
<style>
.bg{fill:#0b0b10}
.ttl{fill:#e8e4dc;font:600 26px 'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif}
.sub{fill:#a09b8d;font:400 15px 'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif}
.hd{fill:#e8e4dc;font:600 16px 'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif}
.lb{fill:#e8e4dc;font:400 13px 'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif}
.sm{fill:#a09b8d;font:400 12px 'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif}
.xs{fill:#6b675c;font:400 11px 'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif}
.foot{fill:#6b675c;font:400 12px 'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif}
.mono{fill:#c9a96a;font:600 13px 'JetBrains Mono',Consolas,monospace}
.moc{fill:#7aa2c8;font:600 13px 'JetBrains Mono',Consolas,monospace}
.mor{fill:#cf5a50;font:600 13px 'JetBrains Mono',Consolas,monospace}
.ar{fill:none;stroke:#8a8578;stroke-width:1.6}
</style>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8a8578"/></marker></defs>
<rect class="bg" x="0" y="0" width="1200" height="760" rx="14"/>
<text class="ttl" x="44" y="50">先问数据，再问模型</text>
<text class="sub" x="44" y="78">选型的第一问不是「哪个模型最强」，而是「你有哪些数据、缺陷怎么定义、节拍多少」。</text>
<rect x="400" y="120" width="400" height="76" rx="10" fill="#121216" fill-opacity="1.0" stroke="#c9a96a" stroke-opacity=".55" stroke-width="1.3"/>
<text class="hd" x="600" y="164" text-anchor="middle" font-size="15pxpx">缺陷能否用明确规则或几何描述？</text>
<rect x="400" y="270" width="400" height="76" rx="10" fill="#121216" fill-opacity="1.0" stroke="#c9a96a" stroke-opacity=".55" stroke-width="1.3"/>
<text class="hd" x="600" y="314" text-anchor="middle" font-size="15pxpx">每类缺陷是否有数百张像素级标注？</text>
<rect x="400" y="420" width="400" height="76" rx="10" fill="#121216" fill-opacity="1.0" stroke="#c9a96a" stroke-opacity=".55" stroke-width="1.3"/>
<text class="hd" x="600" y="464" text-anchor="middle" font-size="15pxpx">是否有覆盖正常波动的良品样本？</text>
<rect x="60" y="300" width="300" height="140" rx="10" fill="#121216" fill-opacity="1.0" stroke="#c9a96a" stroke-opacity=".55" stroke-width="1.3"/>
<text class="hd" x="76" y="330" fill="#c9a96a">经典算法</text>
<text class="sm" x="76" y="358">阈值 / 形态学 / blob</text>
<text class="sm" x="76" y="380">模板匹配 / 3D 测量</text>
<text class="sm" x="76" y="402">确定性、微秒级、可解释</text>
<rect x="840" y="300" width="300" height="140" rx="10" fill="#121216" fill-opacity="1.0" stroke="#7aa2c8" stroke-opacity=".55" stroke-width="1.3"/>
<text class="hd" x="856" y="330" fill="#7aa2c8">监督检测 / 分割</text>
<text class="sm" x="856" y="358">YOLO / U-Net</text>
<text class="sm" x="856" y="380">Mask R-CNN</text>
<text class="sm" x="856" y="402">需要固定缺陷类型</text>
<rect x="60" y="570" width="300" height="140" rx="10" fill="#121216" fill-opacity="1.0" stroke="#8fbf7a" stroke-opacity=".55" stroke-width="1.3"/>
<text class="hd" x="76" y="600" fill="#8fbf7a">无监督异常检测</text>
<text class="sm" x="76" y="628">PatchCore / EfficientAD</text>
<text class="sm" x="76" y="650">Dinomaly</text>
<rect x="840" y="570" width="300" height="140" rx="10" fill="#121216" fill-opacity="1.0" stroke="#cf5a50" stroke-opacity=".55" stroke-width="1.3"/>
<text class="hd" x="856" y="600" fill="#cf5a50">零样本 / 少样本</text>
<text class="sm" x="856" y="628">WinCLIP / AnomalyDINO</text>
<text class="sm" x="856" y="650">先收集数据再蒸馏</text>
<polyline points="400,158 210,158 210,296" fill="none" stroke="#8a8578" stroke-width="1.6" marker-end="url(#ah)"/>
<text class="sm" x="300" y="150" fill="#c9a96a">是</text>
<line x1="600" y1="196" x2="600" y2="266" stroke="#8a8578" stroke-width="1.6" marker-end="url(#ah)"/>
<text class="sm" x="612" y="236">否</text>
<line x1="800" y1="308" x2="836" y2="308" stroke="#8a8578" stroke-width="1.6" marker-end="url(#ah)"/>
<text class="sm" x="818" y="300" fill="#7aa2c8">是</text>
<line x1="600" y1="346" x2="600" y2="416" stroke="#8a8578" stroke-width="1.6" marker-end="url(#ah)"/>
<text class="sm" x="612" y="386">否</text>
<polyline points="400,458 210,458 210,566" fill="none" stroke="#8a8578" stroke-width="1.6" marker-end="url(#ah)"/>
<text class="sm" x="300" y="450" fill="#8fbf7a">是</text>
<polyline points="800,458 990,458 990,566" fill="none" stroke="#8a8578" stroke-width="1.6" marker-end="url(#ah)"/>
<text class="sm" x="900" y="450" fill="#cf5a50">否</text>
<text class="lb" x="44" y="726" fill="#c9a96a">混合是常态：经典对齐 + 无监督检出 + 监督分类 + 规则判逻辑。</text>
<text class="foot" x="44" y="742">决策依据：数据状况 × 缺陷类型 × 节拍｜先定义缺陷，再看数据，最后选模型</text>
</svg>
