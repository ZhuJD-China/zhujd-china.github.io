<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 740" width="100%" role="img" aria-label="四类无监督异常检测范式">
<style>
.bg{fill:#0b0b10}
.ttl{fill:#e8e4dc;font:600 26px 'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif}
.sub{fill:#a09b8d;font:400 15px 'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif}
.hd{fill:#e8e4dc;font:600 16px 'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif}
.lb{fill:#e8e4dc;font:400 13px 'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif}
.sm{fill:#a09b8d;font:400 12px 'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif}
.xs{fill:#6b675c;font:400 11px 'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif}
.foot{fill:#6b675c;font:400 12px 'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif}
.mono{fill:#c9a96a;font:600 13px 'JetBrains Mono',Consolas,monospace}
.moc{fill:#7aa2c8;font:600 13px 'JetBrains Mono',Consolas,monospace}
.mor{fill:#cf5a50;font:600 13px 'JetBrains Mono',Consolas,monospace}
.ar{fill:none;stroke:#8a8578;stroke-width:1.6}
</style>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8a8578"/></marker></defs>
<rect class="bg" x="0" y="0" width="1200" height="740" rx="14"/>
<text class="ttl" x="44" y="50">只有良品时，四条无监督路线</text>
<text class="sub" x="44" y="78">共同前提：训练集只含良品；差异在于「异常」被定义成什么。</text>
<rect x="40" y="120" width="540" height="250" rx="10" fill="#121216" fill-opacity="1.0" stroke="#8a8578" stroke-opacity=".55" stroke-width="1.3"/>
<text class="hd" x="60" y="154" fill="#c9a96a">① 重建 · reconstruction</text>
<text class="lb" x="60" y="184" fill="#e8e4dc">异常 = 重建误差大</text>
<text class="sm" x="60" y="214" fill="#7aa2c8">AE/VAE · DRAEM · RD · Dinomaly</text>
<text class="sm" x="60" y="252">强项  直观、可定位</text>
<text class="sm" x="60" y="278" fill="#cf5a50">失效  锐利纹理也重建不好</text>
<text class="xs" x="60" y="316">训练数据：良品</text>
<text class="xs" x="60" y="336">推理：异常分数 + 阈值</text>
<rect x="620" y="120" width="540" height="250" rx="10" fill="#121216" fill-opacity="1.0" stroke="#8a8578" stroke-opacity=".55" stroke-width="1.3"/>
<text class="hd" x="640" y="154" fill="#c9a96a">② 嵌入密度 · embedding</text>
<text class="lb" x="640" y="184" fill="#e8e4dc">异常 = 离正常特征远</text>
<text class="sm" x="640" y="214" fill="#7aa2c8">SPADE · PaDiM · PatchCore</text>
<text class="sm" x="640" y="252">强项  强基线、少样本友好</text>
<text class="sm" x="640" y="278" fill="#cf5a50">失效  特征偏差、内存成本</text>
<text class="xs" x="640" y="316">训练数据：良品</text>
<text class="xs" x="640" y="336">推理：异常分数 + 阈值</text>
<rect x="40" y="400" width="540" height="250" rx="10" fill="#121216" fill-opacity="1.0" stroke="#8a8578" stroke-opacity=".55" stroke-width="1.3"/>
<text class="hd" x="60" y="434" fill="#c9a96a">③ 学生-教师 · student-teacher</text>
<text class="lb" x="60" y="464" fill="#e8e4dc">异常 = 学生预测误差大</text>
<text class="sm" x="60" y="494" fill="#7aa2c8">STPM · EfficientAD</text>
<text class="sm" x="60" y="532">强项  快、精度高</text>
<text class="sm" x="60" y="558" fill="#cf5a50">失效  学生太强会学会异常</text>
<text class="xs" x="60" y="596">训练数据：良品</text>
<text class="xs" x="60" y="616">推理：异常分数 + 阈值</text>
<rect x="620" y="400" width="540" height="250" rx="10" fill="#121216" fill-opacity="1.0" stroke="#8a8578" stroke-opacity=".55" stroke-width="1.3"/>
<text class="hd" x="640" y="434" fill="#c9a96a">④ 归一化流 · normalizing flow</text>
<text class="lb" x="640" y="464" fill="#e8e4dc">异常 = 似然低</text>
<text class="sm" x="640" y="494" fill="#7aa2c8">FastFlow</text>
<text class="sm" x="640" y="532">强项  密度可解释、推理快</text>
<text class="sm" x="640" y="558" fill="#cf5a50">失效  高维密度估计难</text>
<text class="xs" x="640" y="596">训练数据：良品</text>
<text class="xs" x="640" y="616">推理：异常分数 + 阈值</text>
<rect x="420" y="178" width="36" height="58" rx="4" fill="#1a1712" fill-opacity="1.0" stroke="#c9a96a" stroke-opacity=".55" stroke-width="1.3"/>
<rect x="510" y="178" width="36" height="58" rx="4" fill="#1a1712" fill-opacity="1.0" stroke="#c9a96a" stroke-opacity=".55" stroke-width="1.3"/>
<path d="M 456 188 L 486 200 L 486 214 L 456 226" fill="none" stroke="#c9a96a" stroke-width="1.2"/>
<path d="M 510 188 L 486 200 L 486 214 L 510 226" fill="none" stroke="#c9a96a" stroke-width="1.2"/>
<circle cx="1000" cy="190" r="3.5" fill="#7aa2c8" fill-opacity=".8"/>
<circle cx="1020" cy="212" r="3.5" fill="#7aa2c8" fill-opacity=".8"/>
<circle cx="1045" cy="195" r="3.5" fill="#7aa2c8" fill-opacity=".8"/>
<circle cx="1060" cy="222" r="3.5" fill="#7aa2c8" fill-opacity=".8"/>
<circle cx="1010" cy="232" r="3.5" fill="#7aa2c8" fill-opacity=".8"/>
<circle cx="1035" cy="242" r="3.5" fill="#7aa2c8" fill-opacity=".8"/>
<circle cx="1092" cy="210" r="5" fill="#cf5a50"/>
<rect x="440" y="482" width="40" height="30" rx="4" fill="#181a14" fill-opacity="1.0" stroke="#8fbf7a" stroke-opacity=".55" stroke-width="1.3"/>
<text class="sm" x="460" y="502" text-anchor="middle" fill="#8fbf7a">T</text>
<rect x="510" y="482" width="40" height="30" rx="4" fill="#1a1712" fill-opacity="1.0" stroke="#c9a96a" stroke-opacity=".55" stroke-width="1.3"/>
<text class="sm" x="530" y="502" text-anchor="middle" fill="#c9a96a">S</text>
<line x1="482" y1="497" x2="507" y2="497" stroke="#8a8578" stroke-width="1.2" marker-end="url(#ah)"/>
<path d="M 1010 482 L 1100 482 L 1075 520 L 1035 520 Z" fill="none" stroke="#7aa2c8" stroke-width="1.3"/>
<line x1="1055" y1="520" x2="1055" y2="540" stroke="#7aa2c8" stroke-opacity="0.8" stroke-width="1.2"/>
<text class="lb" x="44" y="690" fill="#c9a96a">四条路线都需要覆盖正常波动的良品样本；「不需要缺陷样本」不等于「不需要数据」。</text>
<text class="foot" x="44" y="722">方法年份：SPADE 2019 / FastFlow 2021 / PaDiM 2021 / PatchCore 2022 / DRAEM 2021 / RD 2022 / EfficientAD 2024 / Dinomaly 2024</text>
</svg>
