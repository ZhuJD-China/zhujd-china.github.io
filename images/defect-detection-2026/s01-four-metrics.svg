<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="100%" role="img" aria-label="同一个 99% 在 0.3% 缺陷率下的混淆矩阵与精确率">
<style>
.bg{fill:#0b0b10}
.ttl{fill:#e8e4dc;font:600 26px 'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif}
.sub{fill:#a09b8d;font:400 15px 'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif}
.hd{fill:#e8e4dc;font:600 16px 'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif}
.lb{fill:#e8e4dc;font:400 13px 'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif}
.sm{fill:#a09b8d;font:400 12px 'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif}
.xs{fill:#6b675c;font:400 11px 'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif}
.foot{fill:#6b675c;font:400 12px 'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif}
.mono{fill:#c9a96a;font:600 13px 'JetBrains Mono',Consolas,monospace}
.moc{fill:#7aa2c8;font:600 13px 'JetBrains Mono',Consolas,monospace}
.mor{fill:#cf5a50;font:600 13px 'JetBrains Mono',Consolas,monospace}
.ar{fill:none;stroke:#8a8578;stroke-width:1.6}
</style>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8a8578"/></marker></defs>
<rect class="bg" x="0" y="0" width="1200" height="640" rx="14"/>
<text class="ttl" x="44" y="50">同一个 99%，在 0.3% 的缺陷率下还剩多少</text>
<text class="sub" x="44" y="78">示例：10,000 件产品，缺陷率 0.3%，召回 90%，特异度 99%。准确率 98.97%，精确率 21.3%。</text>
<text class="sm" x="285" y="192" text-anchor="middle">实际 NG</text>
<text class="sm" x="485" y="192" text-anchor="middle">实际 OK</text>
<text class="sm" x="178" y="270" text-anchor="end">判 NG</text>
<text class="sm" x="178" y="390" text-anchor="end">判 OK</text>
<rect x="190" y="210" width="190" height="110" rx="10" fill="#1a1712" fill-opacity="1.0" stroke="#c9a96a" stroke-opacity=".55" stroke-width="1.3"/>
<text class="hd" x="285.0" y="258" text-anchor="middle" fill="#c9a96a" font-size="24pxpx">TP 27</text>
<text class="sm" x="285.0" y="286" text-anchor="middle">检出</text>
<rect x="390" y="210" width="190" height="110" rx="10" fill="#14161c" fill-opacity="1.0" stroke="#7aa2c8" stroke-opacity=".55" stroke-width="1.3"/>
<text class="hd" x="485.0" y="258" text-anchor="middle" fill="#7aa2c8" font-size="24pxpx">FP 100</text>
<text class="sm" x="485.0" y="286" text-anchor="middle">误报</text>
<rect x="190" y="330" width="190" height="110" rx="10" fill="#1d1414" fill-opacity="1.0" stroke="#cf5a50" stroke-opacity=".55" stroke-width="1.3"/>
<text class="hd" x="285.0" y="378" text-anchor="middle" fill="#cf5a50" font-size="24pxpx">FN 3</text>
<text class="sm" x="285.0" y="406" text-anchor="middle">漏检</text>
<rect x="390" y="330" width="190" height="110" rx="10" fill="#17171a" fill-opacity="1.0" stroke="#8a8578" stroke-opacity=".55" stroke-width="1.3"/>
<text class="hd" x="485.0" y="378" text-anchor="middle" fill="#8a8578" font-size="24pxpx">TN 9,870</text>
<text class="sm" x="485.0" y="406" text-anchor="middle">正确放行</text>
<text class="sm" x="70" y="480">缺陷 30 件；99% 特异度在 9,970 件良品上产生 100 件误报。</text>
<text class="xs" x="70" y="506">准确率被大量真阴性撑高，精确率才反映 NG 判定里有多少是真的。</text>
<rect x="650" y="150" width="500" height="370" rx="10" fill="#121216" fill-opacity="1.0" stroke="#c9a96a" stroke-opacity=".55" stroke-width="1.3"/>
<text class="hd" x="680" y="190">三个数看同一件事</text>
<text class="hd" x="680" y="235" fill="#8a8578" font-size="30pxpx">98.97%</text>
<text class="lb" x="820" y="233" fill="#e8e4dc">准确率</text>
<text class="xs" x="820" y="255">被 9,870 件真阴性撑高</text>
<text class="hd" x="680" y="313" fill="#c9a96a" font-size="30pxpx">21.3%</text>
<text class="lb" x="820" y="311" fill="#e8e4dc">精确率</text>
<text class="xs" x="820" y="333">127 件判 NG，只有 27 件是真缺陷</text>
<text class="hd" x="680" y="391" fill="#7aa2c8" font-size="30pxpx">10.0</text>
<text class="lb" x="820" y="389" fill="#e8e4dc">每千件误报</text>
<text class="xs" x="820" y="411">复检台的直接负担</text>
<text class="sm" x="680" y="470">被判 NG 的 127 件</text>
<rect x="680" y="482" width="91.41732283464567" height="18" rx="4" fill="#c9a96a" fill-opacity="1.0"/>
<rect x="771.4173228346457" y="482" width="338.5826771653543" height="18" rx="4" fill="#7aa2c8" fill-opacity="1.0"/>
<text class="xs" x="725.7086614173228" y="496" text-anchor="middle" fill="#0b0b10">27</text>
<text class="xs" x="940.7086614173229" y="496" text-anchor="middle" fill="#0b0b10">100</text>
<text class="lb" x="70" y="566" fill="#c9a96a">「全部放行」的准确率是 99.7%，比这个模型还高——所以准确率不能当验收指标。</text>
<text class="sm" x="70" y="594">30 个缺陷零漏检，95% 置信上限仍是 10%；要证明漏检率低于 1%，需要约 300 个缺陷样本。</text>
<text class="foot" x="44" y="622">数据：示例算例，二分类混淆矩阵｜置信上限按 rule of three 估算</text>
</svg>
