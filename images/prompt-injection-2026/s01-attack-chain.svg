<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 580" width="100%" role="img" aria-label="提示注入的完整链路">
<style>
.bg{fill:#0b0b10}
.ttl{fill:#e8e4dc;font:600 34px 'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif}
.sub{fill:#a09b8d;font:400 19px 'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif}
.hd{fill:#e8e4dc;font:600 21px 'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif}
.lb{fill:#e8e4dc;font:400 17px 'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif}
.sm{fill:#a09b8d;font:400 15px 'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif}
.xs{fill:#6b675c;font:400 13px 'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif}
.foot{fill:#6b675c;font:400 14px 'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif}
.mono{fill:#c9a96a;font:600 16px 'JetBrains Mono',Consolas,monospace}
.moc{fill:#7aa2c8;font:600 16px 'JetBrains Mono',Consolas,monospace}
.mor{fill:#cf5a50;font:600 16px 'JetBrains Mono',Consolas,monospace}
.ar{fill:none;stroke:#8a8578;stroke-width:1.8}
.grid{stroke:#8a8578;stroke-width:1;stroke-opacity:.16}
</style>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8a8578"/></marker>
<marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c9a96a"/></marker>
</defs>
<rect class="bg" x="0" y="0" width="1000" height="580" rx="14"/>
<text class="ttl" x="36" y="48">提示注入的完整链路</text>
<text class="sub" x="36" y="76">每一步都是合法调用；合起来才是一次越权。</text>
<rect x="16" y="176" width="148" height="114" rx="10" fill="#1a1416" fill-opacity="1.0" stroke="#cf5a50" stroke-opacity=".55" stroke-width="1.2"/>
<text class="mono" x="30" y="204" style="fill:#c9a96a">①</text>
<text class="hd" x="30" y="232" style="font-size:19px">不可信内容</text>
<text class="sm" x="30" y="258" style="font-size:13px">邮件/网页/Issue</text>
<line class="ar" x1="166" y1="233.0" x2="176" y2="233.0" marker-end="url(#ah)"/>
<rect x="180" y="176" width="148" height="114" rx="10" fill="#14161c" fill-opacity="1.0" stroke="#8a8578" stroke-opacity=".55" stroke-width="1.2"/>
<text class="mono" x="194" y="204" style="fill:#c9a96a">②</text>
<text class="hd" x="194" y="232" style="font-size:19px">进入上下文</text>
<text class="sm" x="194" y="258" style="font-size:13px">检索/工具返回</text>
<line class="ar" x1="330" y1="233.0" x2="340" y2="233.0" marker-end="url(#ah)"/>
<rect x="344" y="176" width="148" height="114" rx="10" fill="#14161c" fill-opacity="1.0" stroke="#8a8578" stroke-opacity=".55" stroke-width="1.2"/>
<text class="mono" x="358" y="204" style="fill:#c9a96a">③</text>
<text class="hd" x="358" y="232" style="font-size:19px">模型当成指令</text>
<text class="sm" x="358" y="258" style="font-size:13px">无来源、无优先级</text>
<line class="ar" x1="494" y1="233.0" x2="504" y2="233.0" marker-end="url(#ah)"/>
<rect x="508" y="176" width="148" height="114" rx="10" fill="#14161c" fill-opacity="1.0" stroke="#8a8578" stroke-opacity=".55" stroke-width="1.2"/>
<text class="mono" x="522" y="204" style="fill:#c9a96a">④</text>
<text class="hd" x="522" y="232" style="font-size:19px">调用工具</text>
<text class="sm" x="522" y="258" style="font-size:13px">读私有/写公开</text>
<line class="ar" x1="658" y1="233.0" x2="668" y2="233.0" marker-end="url(#ah)"/>
<rect x="672" y="176" width="148" height="114" rx="10" fill="#14161c" fill-opacity="1.0" stroke="#8a8578" stroke-opacity=".55" stroke-width="1.2"/>
<text class="mono" x="686" y="204" style="fill:#c9a96a">⑤</text>
<text class="hd" x="686" y="232" style="font-size:19px">组合成越权</text>
<text class="sm" x="686" y="258" style="font-size:13px">单次合法，序列越权</text>
<line class="ar" x1="822" y1="233.0" x2="832" y2="233.0" marker-end="url(#ah)"/>
<rect x="836" y="176" width="148" height="114" rx="10" fill="#14161c" fill-opacity="1.0" stroke="#8a8578" stroke-opacity=".55" stroke-width="1.2"/>
<text class="mono" x="850" y="204" style="fill:#c9a96a">⑥</text>
<text class="hd" x="850" y="232" style="font-size:19px">数据外发</text>
<text class="sm" x="850" y="258" style="font-size:13px">链接/图片/PR</text>
<line class="ar" x1="172.0" y1="122" x2="172.0" y2="330" stroke-dasharray="4 5"/>
<text class="xs" x="172.0" y="112" text-anchor="middle">信任边界</text>
<text class="sm" x="90.0" y="330" text-anchor="middle" style="fill:#cf5a50">攻击者写入</text>
<text class="sm" x="332" y="330" text-anchor="middle">系统上下文</text>
<text class="sm" x="746.0" y="330" text-anchor="middle">系统能力</text>
<rect x="24" y="384" width="952" height="84" rx="10" fill="#121318" fill-opacity="1.0" stroke="#8a8578" stroke-opacity=".55" stroke-width="1.2"/>
<text class="hd" x="46" y="416" style="fill:#cf5a50;font-size:20px">EchoLeak（CVE-2025-32711，CVSS 3.1 = 9.3）</text>
<text class="sm" x="46" y="446" style="font-size:14px">邮件 → Copilot 检索 → 指令被当成任务 → 生成带数据的链接 → 借 Teams 代理外发；用户零点击。</text>
<rect x="24" y="490" width="952" height="62" rx="10" fill="#14161c" fill-opacity="1.0" stroke="#8a8578" stroke-opacity=".55" stroke-width="1.2"/>
<text class="sm" x="46" y="518" style="font-size:14px">单点看：读邮件、生成链接、访问 Teams，都是合法操作。</text>
<text class="sm" x="46" y="542" style="fill:#c9a96a;font-size:14px">连起来看：一条从外部文本到内部数据的完整外发通道。</text>
</svg>
