<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="100%" role="img" aria-label="定倍、物方远心、双向远心的尺寸误差对照与远心度规格">
  <style>
    .bg{fill:#0b0b10}
    .ttl{fill:#e8e4dc;font:600 26px 'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif}
    .sub{fill:#a09b8d;font:400 15px 'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif}
    .hd{fill:#e8e4dc;font:600 16px 'Noto Sans SC','PingFang SC',sans-serif}
    .lb{fill:#e8e4dc;font:400 13px 'Noto Sans SC','PingFang SC',sans-serif}
    .sm{fill:#a09b8d;font:400 12px 'Noto Sans SC','PingFang SC',sans-serif}
    .xs{fill:#6b675c;font:400 11px 'Noto Sans SC','PingFang SC',sans-serif}
    .foot{fill:#6b675c;font:400 12px 'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif}
    .mon{fill:#c9a96a;font:600 13px 'JetBrains Mono',Consolas,monospace}
    .moc{fill:#7aa2c8;font:600 13px 'JetBrains Mono',Consolas,monospace}
    .mor{fill:#cf5a50;font:600 13px 'JetBrains Mono',Consolas,monospace}
    .mog{fill:#8fbf7a;font:600 13px 'JetBrains Mono',Consolas,monospace}
    .ax{fill:none;stroke:#8a8578;stroke-width:1.2}
    .grid{fill:none;stroke:#8a8578;stroke-opacity:.18;stroke-width:1}
    .c1{fill:none;stroke:#cf5a50;stroke-width:2.2}
    .c2{fill:none;stroke:#7aa2c8;stroke-width:2.2}
    .c3{fill:none;stroke:#8fbf7a;stroke-width:2.2}
    .band{fill:#8fbf7a;fill-opacity:.08;stroke:#8fbf7a;stroke-opacity:.3;stroke-width:1;stroke-dasharray:3 3}
  </style>
  <rect class="bg" x="0" y="0" width="1200" height="560" rx="14"/>
  <text class="ttl" x="44" y="52">远心：物距一变，普通镜头的读数就变</text>
  <text class="sub" x="44" y="80">横轴是工作距离偏移，纵轴是尺寸误差。双向远心在 ±4 mm 内误差 &lt;0.2%；普通镜头在 1.7 mm 内就已超过 1%</text>

  <!-- 图 -->
  <g transform="translate(96,416)">
    <line class="grid" x1="0" y1="-30" x2="0" y2="-300"/>
    <line class="grid" x1="0" y1="-100" x2="520" y2="-100"/>
    <line class="grid" x1="0" y1="-170" x2="520" y2="-170"/>
    <line class="grid" x1="0" y1="-240" x2="520" y2="-240"/>
    <line class="grid" x1="260" y1="0" x2="260" y2="-300"/>
    <line class="grid" x1="130" y1="0" x2="130" y2="-300"/>
    <line class="grid" x1="390" y1="0" x2="390" y2="-300"/>
    <line class="grid" x1="65" y1="0" x2="65" y2="-300"/>
    <line class="grid" x1="455" y1="0" x2="455" y2="-300"/>
    <line class="ax" x1="-16" y1="0" x2="545" y2="0"/>
    <line class="ax" x1="0" y1="16" x2="0" y2="-316"/>
    <text class="sm" x="-10" y="-28" text-anchor="end">−2%</text>
    <text class="sm" x="-10" y="-68" text-anchor="end">0</text>
    <text class="sm" x="-10" y="-98" text-anchor="end">1%</text>
    <text class="sm" x="-10" y="-168" text-anchor="end">2%</text>
    <text class="sm" x="-10" y="-238" text-anchor="end">3%</text>
    <text class="sm" x="0" y="20" text-anchor="middle">−12</text>
    <text class="sm" x="130" y="20" text-anchor="middle">−6</text>
    <text class="sm" x="260" y="20" text-anchor="middle">0</text>
    <text class="sm" x="390" y="20" text-anchor="middle">+6</text>
    <text class="sm" x="520" y="20" text-anchor="end">+12</text>
    <text class="sm" x="265" y="44" text-anchor="middle">工作距离偏移（mm）</text>
    <text class="sm" x="-40" y="-150" text-anchor="middle" transform="rotate(-90 -40 -150)">尺寸误差</text>

    <rect class="band" x="170" y="-30" width="180" height="270"/>
    <text class="moc" x="352" y="-22" text-anchor="middle">±4 mm：双向远心误差 &lt;0.2%</text>

    <!-- 普通镜头：快 -->
    <path class="c1" d="M0 -298 C60 -250 130 -180 200 -128 C280 -70 380 -32 520 -6"/>
    <!-- 物方远心：中 -->
    <path class="c2" d="M0 -272 C80 -220 170 -160 260 -122 C350 -84 430 -50 520 -24"/>
    <!-- 双向远心：平 -->
    <path class="c3" d="M0 -82 C120 -76 200 -72 260 -70 C340 -68 430 -66 520 -62"/>

    <text class="mor" x="150" y="-176">普通定焦镜头</text>
    <text class="mor" x="156" y="-192">±1.7 mm 就到 1%</text>
    <text class="moc" x="200" y="-146">物方远心</text>
    <text class="mog" x="300" y="-88">双向远心（bi-telecentric）</text>
  </g>

  <!-- 右栏 -->
  <g transform="translate(700,140)">
    <text class="hd" x="0" y="0">远心度实测型值（越小越好）</text>
    <g class="sm">
      <text x="0" y="26">EO CompactTL 1× 65 mm　　　0.013°</text>
      <text x="0" y="46">EO CompactTL 0.5× 65 mm　　0.051°</text>
      <text x="0" y="66">EO CompactTL 0.5× 110 mm　 0.064°</text>
      <text x="0" y="86">EO CompactTL 1× 110 mm　　0.088°</text>
    </g>
    <text class="sm" x="0" y="114">Opto-Engineering 用「典型 / 最大保证」双值：</text>
    <text class="sm" x="0" y="134">TC23085（0.104×）　&lt;0.04° / <tspan class="mor">0.08°</tspan></text>
    <text class="sm" x="0" y="154">TC23120（0.072×）　&lt;0.07° / <tspan class="mor">0.08°</tspan></text>
    <text class="xs" x="0" y="174">→ 选型要「最大保证值」，典型值不能当保证值</text>
  </g>

  <g transform="translate(700,350)">
    <text class="hd" x="0" y="0">三条必须记住的取舍</text>
    <text class="sm" x="0" y="26">1　「远心天然景深更大」是错的。景深由波长与 f/# 决定。</text>
    <text class="sm" x="44" y="46">远心的优势是离焦时质心不漂移，边缘仍可测量。</text>
    <text class="sm" x="0" y="72">2　视场是硬约束。前镜片直径决定 FOV：主流远心</text>
    <text class="sm" x="44" y="92">40–50 mm，部分 100–150 mm，最大定制 305–356 mm。</text>
    <text class="sm" x="0" y="118">3　工作距离须在标称 ±3% 内（Schneider SYLVINE 0.5×</text>
    <text class="sm" x="44" y="138">机械调焦行程仅 ±3 mm）。买得起但装不准等于没买。</text>
  </g>

  <g transform="translate(700,510)">
    <text class="sm" x="0" y="0">价格量级：CompactTL 1× 65 mm $645 · 0.5× 110 mm Inline $1,225</text>
    <text class="xs" x="0" y="20">对照：同厂 16 mm C-mount 定焦约 $299（第一篇第 11.3 节）</text>
  </g>

  <text class="foot" x="44" y="524">口径：三镜头对比曲线为 Edmund Optics 应用笔记实测形态重绘（双向远心 ±4 mm 内误差 &lt;0.2%）；远心度与价格引自 EO 各型号页与官网标价；±1.7 mm / ±12.5 mm 算例引自 EO 选型笔记。</text>
  <text class="foot" x="44" y="544">曲线为示意形态重绘，不按实测数据点连线；远心度一栏为厂商标称/实测型值。</text>
</svg>
