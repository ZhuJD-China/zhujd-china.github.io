<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="100%" role="img" aria-label="NVFP4 与 MXFP4 的分组缩放结构对照">
  <style>
    .bg{fill:#0b0b10}
    .ttl{fill:#e8e4dc;font:600 26px 'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif}
    .sub{fill:#a09b8d;font:400 15px 'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif}
    .pn{fill:#6b675c;font:600 12px 'Noto Sans SC','PingFang SC',sans-serif}
    .hd{fill:#e8e4dc;font:600 15px 'Noto Sans SC','PingFang SC',sans-serif}
    .lb{fill:#e8e4dc;font:500 13px 'Noto Sans SC','PingFang SC',sans-serif}
    .sm{fill:#a09b8d;font:400 12px 'Noto Sans SC','PingFang SC',sans-serif}
    .eq{fill:#c9a96a;font:600 15px 'JetBrains Mono',Consolas,monospace}
    .b1{fill:#1a1712;stroke:#c9a96a;stroke-width:1.3}
    .b2{fill:#14161c;stroke:#7aa2c8;stroke-width:1.3}
    .v{fill:#c9a96a;fill-opacity:.8}
    .vs{fill:#7aa2c8;fill-opacity:.8}
    .s1{fill:#cf5a50;fill-opacity:.9}
    .div{stroke:#e8e4dc;stroke-opacity:.14;stroke-width:1}
    .arw{stroke:#8a8578;stroke-width:1.6;fill:none;marker-end:url(#q1)}
    .foot{fill:#6b675c;font:400 12px 'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif}
  </style>
  <defs>
    <marker id="q1" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto">
      <path d="M0 0 L7 4 L0 8 z" fill="#8a8578"/>
    </marker>
  </defs>
  <rect class="bg" x="0" y="0" width="1200" height="600" rx="14"/>
  <text class="ttl" x="44" y="52">NVFP4 的 4.5 bit 每值是怎么来的：三级缩放</text>
  <text class="sub" x="44" y="80">依据 NVIDIA 官方技术说明重绘。4bit 只描述数据本身，真实的每权重开销必须把两级 scale 算进去</text>

  <!-- level 0: values -->
  <text class="pn" x="44" y="118">第 0 级　数据本体</text>
  <g transform="translate(44,130)">
    <rect class="b1" x="0" y="0" width="200" height="86" rx="10"/>
    <g transform="translate(14,16)">
      <rect class="v" x="0" y="0" width="16" height="16" rx="2"/><rect class="v" x="20" y="0" width="16" height="16" rx="2"/>
      <rect class="v" x="40" y="0" width="16" height="16" rx="2"/><rect class="v" x="60" y="0" width="16" height="16" rx="2"/>
      <rect class="v" x="80" y="0" width="16" height="16" rx="2"/><rect class="v" x="100" y="0" width="16" height="16" rx="2"/>
      <rect class="v" x="120" y="0" width="16" height="16" rx="2"/><rect class="v" x="140" y="0" width="16" height="16" rx="2"/>
      <rect class="v" x="0" y="20" width="16" height="16" rx="2"/><rect class="v" x="20" y="20" width="16" height="16" rx="2"/>
      <rect class="v" x="40" y="20" width="16" height="16" rx="2"/><rect class="v" x="60" y="20" width="16" height="16" rx="2"/>
      <rect class="v" x="80" y="20" width="16" height="16" rx="2"/><rect class="v" x="100" y="20" width="16" height="16" rx="2"/>
      <rect class="v" x="120" y="20" width="16" height="16" rx="2"/><rect class="v" x="140" y="20" width="16" height="16" rx="2"/>
    </g>
    <text class="sm" x="14" y="72">16 个 E2M1 值</text>
  </g>

  <path class="arw" d="M252 173 L292 173"/>

  <!-- level 1: block scale -->
  <text class="pn" x="300" y="118">第 1 级　块内缩放</text>
  <g transform="translate(300,130)">
    <rect class="b1" x="0" y="0" width="200" height="86" rx="10"/>
    <rect class="s1" x="14" y="34" width="30" height="18" rx="3"/>
    <text class="sm" x="54" y="48">1 个 E4M3 scale</text>
    <text class="sm" x="14" y="72">每 16 个值共享一个</text>
  </g>

  <path class="arw" d="M508 173 L548 173"/>

  <!-- level 2: tensor scale -->
  <text class="pn" x="556" y="118">第 2 级　张量缩放</text>
  <g transform="translate(556,130)">
    <rect class="b1" x="0" y="0" width="200" height="86" rx="10"/>
    <rect class="s1" x="14" y="34" width="46" height="18" rx="3"/>
    <text class="sm" x="70" y="48">1 个 FP32 scale</text>
    <text class="sm" x="14" y="72">整个张量共享一个</text>
  </g>

  <path class="arw" d="M764 173 L804 173"/>

  <!-- result -->
  <text class="pn" x="812" y="118">合计</text>
  <g transform="translate(812,130)">
    <rect class="b1" x="0" y="0" width="330" height="86" rx="10" fill-opacity=".7"/>
    <text class="eq" x="18" y="40">4 bit 数据 + 0.25 bit 块 scale</text>
    <text class="eq" x="18" y="66">+ 0.25 bit 张量 scale  ≈ 4.5 bit/值</text>
  </g>

  <line class="div" x1="44" y1="252" x2="1156" y2="252"/>

  <!-- MXFP4 contrast -->
  <text class="hd" x="44" y="284">与 MXFP4 的差别：分组大小与 scale 的编码方式</text>

  <rect class="b2" x="44" y="302" width="540" height="168" rx="10"/>
  <text class="pn" x="60" y="324">MXFP4（OCP 微缩放规范）</text>
  <g transform="translate(60,340)">
    <rect class="vs" x="0" y="0" width="12" height="14" rx="2"/><rect class="vs" x="15" y="0" width="12" height="14" rx="2"/>
    <rect class="vs" x="30" y="0" width="12" height="14" rx="2"/><rect class="vs" x="45" y="0" width="12" height="14" rx="2"/>
    <rect class="vs" x="60" y="0" width="12" height="14" rx="2"/><rect class="vs" x="75" y="0" width="12" height="14" rx="2"/>
    <rect class="vs" x="90" y="0" width="12" height="14" rx="2"/><rect class="vs" x="105" y="0" width="12" height="14" rx="2"/>
    <rect class="vs" x="120" y="0" width="12" height="14" rx="2"/><rect class="vs" x="135" y="0" width="12" height="14" rx="2"/>
    <rect class="vs" x="150" y="0" width="12" height="14" rx="2"/><rect class="vs" x="165" y="0" width="12" height="14" rx="2"/>
    <rect class="vs" x="180" y="0" width="12" height="14" rx="2"/><rect class="vs" x="195" y="0" width="12" height="14" rx="2"/>
    <text class="sm" x="216" y="12">32 个值</text>
    <rect class="s1" x="0" y="24" width="24" height="16" rx="3"/>
    <text class="sm" x="32" y="37">1 个 E8M0 scale（2 的幂次）</text>
  </g>
  <text class="sm" x="60" y="404">scale 取值只能是 2 的幂，好处是缩放本身几乎免费、</text>
  <text class="sm" x="60" y="426">硬件实现简单；代价是量程粗，同一组内的实际动态范围</text>
  <text class="sm" x="60" y="448">常常装不下，只能靠更细的分块或额外变换补救。</text>

  <rect class="b1" x="616" y="302" width="540" height="168" rx="10"/>
  <text class="pn" x="632" y="324">NVFP4（NVIDIA）</text>
  <g transform="translate(632,340)">
    <rect class="v" x="0" y="0" width="12" height="14" rx="2"/><rect class="v" x="15" y="0" width="12" height="14" rx="2"/>
    <rect class="v" x="30" y="0" width="12" height="14" rx="2"/><rect class="v" x="45" y="0" width="12" height="14" rx="2"/>
    <rect class="v" x="60" y="0" width="12" height="14" rx="2"/><rect class="v" x="75" y="0" width="12" height="14" rx="2"/>
    <rect class="v" x="90" y="0" width="12" height="14" rx="2"/><rect class="v" x="105" y="0" width="12" height="14" rx="2"/>
    <text class="sm" x="126" y="12">16 个值</text>
    <rect class="s1" x="0" y="24" width="30" height="16" rx="3"/>
    <text class="sm" x="38" y="37">1 个 E4M3 scale（带符号浮点，量程细）</text>
  </g>
  <text class="sm" x="632" y="404">块更小、scale 更细，量程控制更贴合实际分布；</text>
  <text class="sm" x="632" y="426">代价是块 scale 占的开销翻倍（0.125 bit 对 0.25 bit 每值），</text>
  <text class="sm" x="632" y="448">且需要 Blackwell 一代的硬件内核才吃得下。</text>

  <line class="div" x1="44" y1="492" x2="1156" y2="492"/>
  <text class="foot" x="44" y="516">实践含义：同为"4bit"，MXFP4 与 NVFP4 不能直接比大小或比精度——它们是两个不同的算法与硬件协同体系，选型要看目标加速卡支持哪种原生格式。</text>
  <text class="foot" x="44" y="540">上图为结构示意，格子数量按分组大小等比绘制；4.5 bit 每值与显存对比（较 FP16 约省 3.5 倍、较 FP8 约省 1.8 倍）出自 NVIDIA 官方说明。</text>
</svg>
