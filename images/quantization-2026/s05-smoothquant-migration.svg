<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="100%" role="img" aria-label="SmoothQuant 数学等价迁移示意图">
  <style>
    .bg{fill:#0b0b10}
    .ttl{fill:#e8e4dc;font:600 26px 'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif}
    .sub{fill:#a09b8d;font:400 15px 'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif}
    .pn{fill:#6b675c;font:600 12px 'Noto Sans SC','PingFang SC',sans-serif}
    .hd{fill:#e8e4dc;font:600 16px 'Noto Sans SC','PingFang SC',sans-serif}
    .lb{fill:#e8e4dc;font:500 14px 'Noto Sans SC','PingFang SC',sans-serif}
    .an{fill:#a09b8d;font:400 12px 'Noto Sans SC','PingFang SC',sans-serif}
    .hot{fill:#cf5a50;font:600 13px 'Noto Sans SC','PingFang SC',sans-serif}
    .eq{fill:#c9a96a;font:600 17px 'JetBrains Mono',Consolas,monospace}
    .act{fill:#14161c;stroke:#7aa2c8;stroke-width:1.3}
    .bef{fill:#1d1414;stroke:#cf5a50;stroke-width:1.3}
    .aft{fill:#1a1712;stroke:#c9a96a;stroke-width:1.3}
    .warn{fill:#cf5a50}
    .ok{fill:#c9a96a}
    .arw{stroke:#8a8578;stroke-width:1.6;fill:none;marker-end:url(#ah2)}
    .div{stroke:#e8e4dc;stroke-opacity:.14;stroke-width:1}
    .foot{fill:#6b675c;font:400 12px 'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif}
  </style>
  <defs>
    <marker id="ah2" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto">
      <path d="M0 0 L7 4 L0 8 z" fill="#8a8578"/>
    </marker>
  </defs>
  <rect class="bg" x="0" y="0" width="1200" height="560" rx="14"/>
  <text class="ttl" x="44" y="52">SmoothQuant：把激活的量化难度，数学等价地搬到权重上</text>
  <text class="sub" x="44" y="80">重绘自 SmoothQuant 论文（arXiv:2211.10438）的迁移示意图。关键在于这一步是等价变换而非近似</text>

  <!-- before -->
  <text class="pn" x="44" y="120">量化前</text>
  <rect class="act" x="44" y="132" width="230" height="96" rx="8"/>
  <text class="lb" x="60" y="158">激活 X</text>
  <g transform="translate(60,170)">
    <rect class="ok" x="0" y="0" width="12" height="46" rx="2" fill-opacity=".8"/>
    <rect class="warn" x="16" y="0" width="12" height="46" rx="2" fill-opacity=".9"/>
    <rect class="ok" x="32" y="0" width="12" height="46" rx="2" fill-opacity=".8"/>
    <rect class="warn" x="48" y="0" width="12" height="46" rx="2" fill-opacity=".9"/>
    <rect class="ok" x="64" y="0" width="12" height="46" rx="2" fill-opacity=".8"/>
    <rect class="ok" x="80" y="0" width="12" height="46" rx="2" fill-opacity=".8"/>
    <rect class="ok" x="96" y="0" width="12" height="46" rx="2" fill-opacity=".8"/>
    <rect class="ok" x="112" y="0" width="12" height="46" rx="2" fill-opacity=".8"/>
  </g>
  <text class="hot" x="196" y="184">离群：幅度可达 100×</text>
  <text class="an" x="196" y="204">INT8 下有效量化</text>
  <text class="an" x="196" y="222">电平只剩 2 到 3</text>

  <rect class="act" x="44" y="244" width="230" height="70" rx="8"/>
  <text class="lb" x="60" y="270">权重 W</text>
  <text class="an" x="60" y="292">分布温和，好量化</text>

  <!-- arrow + transform -->
  <path class="arw" d="M286 205 L326 205"/>
  <rect class="bef" x="332" y="160" width="256" height="150" rx="10" fill-opacity=".6"/>
  <text class="pn" x="348" y="184">乘以可吸收的缩放对角阵 S</text>
  <text class="eq" x="348" y="216">X W  =  (X S) (S⁻¹ W)</text>
  <text class="an" x="348" y="244">S 由激活的逐通道幅值决定，</text>
  <text class="an" x="348" y="264">S = max|X_j|^α / max|W_j|^(1−α)</text>
  <text class="an" x="348" y="288">因为 X·W 里 S 与 S⁻¹ 相邻，</text>
  <text class="an" x="348" y="304">数学上完全抵消</text>

  <path class="arw" d="M594 235 L634 235"/>

  <!-- after -->
  <text class="pn" x="642" y="120">量化后</text>
  <rect class="aft" x="642" y="132" width="230" height="96" rx="8"/>
  <text class="lb" x="658" y="158">激活 X S</text>
  <g transform="translate(658,170)">
    <rect class="ok" x="0" y="0" width="12" height="46" rx="2" fill-opacity=".55"/>
    <rect class="ok" x="16" y="0" width="12" height="46" rx="2" fill-opacity=".55"/>
    <rect class="ok" x="32" y="0" width="12" height="46" rx="2" fill-opacity=".55"/>
    <rect class="ok" x="48" y="0" width="12" height="46" rx="2" fill-opacity=".55"/>
    <rect class="ok" x="64" y="0" width="12" height="46" rx="2" fill-opacity=".55"/>
    <rect class="ok" x="80" y="0" width="12" height="46" rx="2" fill-opacity=".55"/>
    <rect class="ok" x="96" y="0" width="12" height="46" rx="2" fill-opacity=".55"/>
    <rect class="ok" x="112" y="0" width="12" height="46" rx="2" fill-opacity=".55"/>
  </g>
  <text class="ok" x="800" y="186">离群被压平</text>
  <text class="an" x="800" y="206">分布变得可量化</text>
  <text class="an" x="800" y="224">代价：权重那一侧</text>
  <text class="an" x="800" y="242">被 S⁻¹ 放大一点</text>

  <rect class="aft" x="642" y="244" width="230" height="70" rx="8"/>
  <text class="lb" x="658" y="270">权重 S⁻¹ W</text>
  <text class="an" x="658" y="292">放大后仍可量化</text>

  <!-- tradeoff box -->
  <rect class="aft" x="900" y="132" width="256" height="182" rx="10" fill-opacity=".45"/>
  <text class="pn" x="916" y="158">α 是一个权衡旋钮</text>
  <text class="an" x="916" y="184">α 小：激活基本没被压，</text>
  <text class="an" x="916" y="204">权重被放得太过，量化变难</text>
  <text class="an" x="916" y="232">α 大：激活压得很平，</text>
  <text class="an" x="916" y="252">权重被放大到难以表示</text>
  <text class="an" x="916" y="280">论文按模型逐个网格搜索，</text>
  <text class="an" x="916" y="300">不存在一个通用最优值</text>

  <line class="div" x1="44" y1="350" x2="1156" y2="350"/>
  <text class="pn" x="44" y="378">为什么这条路比"只保护离群通道"更好</text>
  <text class="an" x="44" y="404">AWQ 那一类做法要把显著通道整条保护起来，需要定制算子支持混合精度；SmoothQuant 全程保持 INT8，只是换了一个等价的缩放，因此可以直接跑在通用 INT8 内核上。</text>
  <text class="an" x="44" y="428">代价是它把精度压力从激活转移到了权重，所以对 outlier 特别多的模型要调大 α——论文在 GLM-130B 上就取了 0.75。</text>

  <text class="foot" x="44" y="490">重绘自 Xiao et al., SmoothQuant: Accurate and Efficient Post-Training Quantization for Large Language Models, arXiv:2211.10438（ICML 2023）原文图 1 与图 2。</text>
  <text class="foot" x="44" y="512">图中条形高度为示意，不按真实数值比例；α 的取值范围与逐模型调参结论见原文。</text>
</svg>
